<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Le Portier N°35 – Wochenzentrale</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1c1b19;--mut:#6f6a62;--line:#e3dfd7;--acc:#8a6a2f;--accbg:#f3ead8;--red:#b3261e;--redbg:#fbe9e7;--grn:#1f7a4a;--grnbg:#e4f3ea;--amb:#9a6200;--ambbg:#fdf0d5;--blu:#1f5fa8;--blubg:#e4eefa;--side:#1c1b19}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px}
.mut{color:var(--mut)}.sm{font-size:13px}.num{font-variant-numeric:tabular-nums;white-space:nowrap}.r{text-align:right}
#app{display:flex;min-height:100vh}
nav{width:220px;background:var(--side);color:#eee;padding:18px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{font-weight:700;padding:0 10px 14px;letter-spacing:.3px}nav .brand span{display:block;font-weight:400;font-size:12px;color:#aaa}
nav a{display:block;color:#ddd;text-decoration:none;padding:9px 10px;border-radius:8px;margin-bottom:2px}
nav a.on{background:#3a352c;color:#fff}nav a:hover{background:#2c2925}
nav .who{margin-top:16px;padding:10px;font-size:12px;color:#aaa;border-top:1px solid #333}
nav button{background:none;border:1px solid #555;color:#ddd;border-radius:6px;padding:5px 9px;margin-top:6px;cursor:pointer}
main{flex:1;padding:22px;min-width:0;max-width:1250px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
table{width:100%;border-collapse:collapse}th{font-size:12px;text-align:left;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}tr.click{cursor:pointer}tr.click:hover{background:#faf8f4}
.tw{overflow-x:auto}
.b{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b.offen{background:var(--blubg);color:var(--blu)}.b.in_bearbeitung{background:var(--ambbg);color:var(--amb)}.b.erledigt{background:var(--grnbg);color:var(--grn)}.b.zu_pruefen{background:var(--redbg);color:var(--red)}
.b.p1{background:var(--red);color:#fff}.b.p2{background:var(--accbg);color:var(--acc)}.b.p3{background:#eee;color:#555}.b.g{background:#eee;color:#555}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #cfc9bd;border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
textarea{width:100%;min-height:70px}
button.btn{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.btn.sec{background:#fff;color:var(--acc)}button.btn.xs{padding:3px 8px;font-size:12px}
dialog{border:none;border-radius:14px;padding:0;width:min(680px,94vw);max-height:92vh}dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}.fg .w{grid-column:1/-1}
.fg input,.fg select{width:100%}
.note{background:var(--ambbg);border:1px solid #ecd9a8;color:#5c4300;padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.note.red{background:var(--redbg);border-color:#f1c4bf;color:#7a1b15}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90vw}
.login{max-width:380px;margin:9vh auto;padding:0 16px}.login .card>*{width:100%;margin-bottom:10px}
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto}
.day{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px}.day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.day .d{font-size:12px;color:var(--mut);margin-bottom:6px}.ev{font-size:12px;background:var(--accbg);border-radius:6px;padding:4px 6px;margin-bottom:4px;cursor:pointer}.ev.rec{background:var(--blubg)}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:38px}
.chart .bars{display:flex;align-items:flex-end;gap:3px;height:120px}.chart .bars i{width:14px;display:block;border-radius:3px 3px 0 0}.chart .in{background:var(--grn)}.chart .out{background:var(--red)}
@media(max-width:800px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:8px;gap:4px;align-items:center}nav .brand{padding:0 8px;white-space:nowrap}nav .brand span{display:none}nav a{white-space:nowrap;margin:0;padding:7px 10px}nav .who{border:none;margin:0;padding:0 8px;white-space:nowrap}main{padding:14px}.fg{grid-template-columns:1fr}td,th{padding:6px}}
@media print{nav,.bar,button{display:none!important}main{padding:0}}
</style>

<body>
<div id="root"></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
const sb = supabase.createClient('https://pvrvhkyvnlafipbmidon.supabase.co','sb_publishable_dE2ZMkj9nEFy7lJ4miiTVw_5wvggHC_');
const $=s=>document.querySelector(s), root=$('#root'), dlg=$('#dlg');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chf=n=>n==null||n===''?'–':'CHF '+Number(n).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return x.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const fd=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'–';
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>{const d=new Date(s+'T12:00');return addDays(s,-((d.getDay()+6)%7))};
const ST={offen:'Offen',in_bearbeitung:'In Bearbeitung',erledigt:'Erledigt',zu_pruefen:'Zu prüfen'};
const PR={hoch:'1',mittel:'2',niedrig:'3'};
const CAT={aufgabe:'Aufgabe',zahlung:'Zahlung',event:'Event',lieferant:'Lieferant',dokument:'Dokument',personal:'Personal',vertrag:'Vertrag'};
const PEOPLE=['Arben','Dennis','Levent'];
const DOCCAT={'Lieferantenrechnungen':'lieferantenrechnungen','Bankauszüge':'vertraulich/bankauszuege','Zahlungsbestätigungen':'zahlungsbestaetigungen','Eventabrechnungen':'eventabrechnungen','Arbeitsverträge':'vertraulich/arbeitsvertraege','Lohnabrechnungen':'vertraulich/lohnabrechnungen','Versicherungen':'versicherungen','Mietvertrag':'mietvertrag','Betreibungen':'vertraulich/betreibungen','Buchhaltung':'vertraulich/buchhaltung','Sponsoringverträge':'sponsoringvertraege','personal':'vertraulich/personal','finanzen':'vertraulich/finanzen','buchhaltung':'vertraulich/buchhaltung','event':'eventabrechnungen','lieferant/vertrag':'lieferant-vertrag'};
const KIND={normal:'Normal',lieferantenbestellung:'Lieferantenbestellung',schuldenrueckzahlung:'Schuldenrückzahlung',lohn:'Lohn',event:'Event',sonstiges:'Sonstiges'};
const RV={ok:'OK',zu_pruefen:'Zu prüfen',duplikat:'Duplikat'};
const EVF=[['veranstalter','Veranstalter'],['verantwortlich','Verantwortliche'],['dj','DJ'],['security','Security'],['bar','Bar'],['garderobe','Garderobe'],['personalstunden','Personalstunden','n'],['ein_ticket','Ticketeinnahmen CHF','n'],['ein_karte','Karteneinnahmen CHF','n'],['ein_twint','TWINT-Einnahmen CHF','n'],['ein_bar','Bareinnahmen CHF','n'],['kosten_getraenke','Getränkekosten CHF','n'],['kosten_weitere','Weitere Ausgaben CHF','n'],['fehlende_belege','Fehlende Belege'],['freigabe','Zahlungsfreigabe']];
let S={user:null,role:null,records:[],recurring:[],docs:[],tx:[],bal:[],changes:[],f:{}};
const admin=()=>S.role==='admin', canEdit=()=>S.role==='admin'||S.role==='editor';
function toast(m,err){const t=$('#toast');t.textContent=m;t.style.background=err?'#b3261e':'#222';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',err?6000:2600)}
const fail=e=>{console.error(e);toast('Fehler: '+(e.message||e),1)};
const sbadge=s=>`<span class="b ${esc(s)}">${esc(ST[s]||s)}</span>`;
const pbadge=p=>`<span class="b p${PR[p]||2}" title="Priorität">P${PR[p]||'?'}</span>`;
const opts=(o,sel,all)=>(all?`<option value="">${all}</option>`:'')+Object.entries(o).map(([k,v])=>`<option value="${esc(k)}"${k===sel?' selected':''}>${esc(v)}</option>`).join('');

/* ---------- Anmeldung ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return loginView();
  S.user=session.user;
  const {data:m}=await sb.from('lp_members').select('role,display_name').eq('user_id',S.user.id).maybeSingle();
  if(!m) return root.innerHTML=`<div class="login"><div class="card"><h1>Zugang noch nicht freigeschaltet</h1><p>Angemeldet als <b>${esc(S.user.email)}</b>. Dein Konto muss zuerst von Arben freigeschaltet werden.</p><button class="btn sec" onclick="logout()">Abmelden</button></div></div>`;
  S.role=m.role;S.name=m.display_name||S.user.email;
  await load();shell();route();
}
function loginView(msg){
  root.innerHTML=`<div class="login"><div class="card"><h1>Le Portier N°35</h1><p class="mut">Wochenzentrale – Anmeldung</p>
  ${msg?`<div class="note">${esc(msg)}</div>`:''}
  <input id="le" type="email" placeholder="E-Mail" autocomplete="username"><input id="lp" type="password" placeholder="Passwort (mind. 8 Zeichen)" autocomplete="current-password">
  <button class="btn" id="li">Anmelden</button><button class="btn sec" id="lr">Neues Konto registrieren</button>
  <button class="btn sec" id="lf">Passwort vergessen</button></div></div>`;
  const cred=()=>({email:$('#le').value.trim(),password:$('#lp').value});
  $('#li').onclick=async()=>{const {error}=await sb.auth.signInWithPassword(cred());error?toast('Anmeldung fehlgeschlagen: '+error.message,1):boot()};
  $('#lp').onkeydown=e=>{if(e.key==='Enter')$('#li').click()};
  $('#lr').onclick=async()=>{const c=cred();if(c.password.length<8)return toast('Passwort mindestens 8 Zeichen',1);const {data,error}=await sb.auth.signUp({...c,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return fail(error);data.session?boot():loginView('Konto erstellt. Bitte den Link in der Bestätigungs-E-Mail anklicken und danach hier anmelden.')};
  $('#lf').onclick=async()=>{const e=$('#le').value.trim();if(!e)return toast('E-Mail eintragen',1);const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});error?fail(error):toast('E-Mail zum Zurücksetzen gesendet')};
}
async function logout(){await sb.auth.signOut();location.hash='';location.reload()}
sb.auth.onAuthStateChange(async ev=>{if(ev==='PASSWORD_RECOVERY'){const p=prompt('Neues Passwort (mind. 8 Zeichen):');if(p&&p.length>=8){const {error}=await sb.auth.updateUser({password:p});error?fail(error):toast('Passwort geändert')}}});

async function load(){
  const q=[sb.from('lp_records').select('*').order('due_date',{nullsFirst:false}),sb.from('lp_recurring').select('*').order('next_due'),sb.from('lp_documents').select('*').order('file_name'),
    sb.from('lp_bank_tx').select('*').order('booking_date',{ascending:false}).limit(3000),sb.from('lp_bank_balance').select('*').order('as_of',{ascending:false}).limit(5),
    sb.from('lp_changes').select('*').order('changed_at',{ascending:false}).limit(150)];
  const r=await Promise.all(q);const e=r.find(x=>x.error);if(e)fail(e.error);
  [S.records,S.recurring,S.docs,S.tx,S.bal,S.changes]=r.map(x=>x.data||[]);
}
async function refresh(){await load();route()}

/* ---------- Rahmen ---------- */
const NAV=[['uebersicht','Übersicht'],['aufgaben','Aufgaben'],['finanzen','Finanzen'],['events','Events'],['lieferanten','Lieferanten'],['personal','Personal'],['dokumente','Dokumente'],['kalender','Kalender'],['email','E-Mail'],['protokoll','Protokoll']];
function shell(){
  root.innerHTML=`<div id="app"><nav><div class="brand">Le Portier N°35<span>Wochenzentrale</span></div>${NAV.map(([k,l])=>`<a href="#${k}" data-k="${k}">${l}</a>`).join('')}
  <div class="who">${esc(S.name)} · ${esc({admin:'Admin',editor:'Bearbeiter',viewer:'Nur lesen'}[S.role])}<br><button onclick="logout()">Abmelden</button></div></nav><main id="main"></main></div>`;
}
window.onhashchange=()=>S.role&&route();
function route(){
  const k=(location.hash.slice(1)||'uebersicht');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));
  ({uebersicht:vHome,aufgaben:()=>vList('aufgaben'),finanzen:vFin,events:()=>vList('events'),lieferanten:()=>vList('lieferanten'),personal:()=>vList('personal'),dokumente:vDocs,kalender:vCal,email:vMail,protokoll:vLog}[k]||vHome)();
}
const M=h=>$('#main').innerHTML=h;
const open=r=>r.status!=='erledigt';
const paidFor=id=>S.tx.filter(t=>t.record_id===id).reduce((a,t)=>a+Math.abs(+t.amount_chf),0);

/* ---------- Übersicht ---------- */
function vHome(){
  const t=today(),ws=monday(t),we=addDays(ws,6),R=S.records;
  const pay=R.filter(r=>r.category==='zahlung'),po=pay.filter(open),pd=pay.filter(r=>!open(r));
  const sum=a=>a.reduce((x,r)=>x+(+r.amount_chf||0),0);
  const crit=R.filter(r=>open(r)&&((r.due_date&&r.due_date<=addDays(t,7))||(/betreibung|mahnung/i.test(r.title+' '+r.notes)&&r.priority==='hoch')));
  const todayL=R.filter(r=>open(r)&&r.due_date&&r.due_date<=t), weekL=R.filter(r=>open(r)&&r.due_date&&r.due_date>t&&r.due_date<=we);
  const rec=S.recurring.filter(r=>r.active&&r.next_due<=we);
  const p1=R.filter(r=>open(r)&&r.priority==='hoch'&&!r.due_date);
  const b=S.bal[0],ev=R.filter(r=>r.category==='event'),miss=S.docs.filter(d=>!d.storage_path).length;
  const row=r=>`<tr class="click" onclick="editRec('${r.id}')"><td>${pbadge(r.priority)}</td><td>${esc(r.title)}<div class="mut sm">${esc(CAT[r.category])} · ${esc(r.responsible||'nicht zugewiesen')}</div></td><td class="num r">${r.amount_chf!=null?chf(r.amount_chf):''}<div class="sm ${r.due_date&&r.due_date<t?'':'mut'}" style="${r.due_date&&r.due_date<t?'color:var(--red)':''}">${r.due_date?fd(r.due_date):''}</div></td><td>${sbadge(r.status)}</td></tr>`;
  const tbl=(a,empty)=>a.length?`<div class="tw"><table>${a.map(row).join('')}</table></div>`:`<p class="mut sm">${empty}</p>`;
  M(`<h1>Übersicht</h1><p class="mut">Woche ${fd(ws)} – ${fd(we)}</p>
  <div class="grid">
   ${admin()?`<div class="card kpi"><div class="l">Kontostand Valiant</div><div class="v num">${b?chf(b.amount_chf):'–'}</div><div class="sm mut">${b?'Stand '+fd(b.as_of):'kein Stand erfasst'}</div></div>`:''}
   <div class="card kpi"><div class="l">Offene Zahlungen</div><div class="v num">${chf(sum(po))}</div><div class="sm mut">${po.length} Positionen, ${po.filter(r=>r.amount_chf==null).length} ohne Betrag</div></div>
   <div class="card kpi"><div class="l">Erledigte Zahlungen</div><div class="v num">${chf(sum(pd))}</div><div class="sm mut">${pd.length} Positionen</div></div>
   <div class="card kpi"><div class="l">Kritische Fristen</div><div class="v" style="color:${crit.length?'var(--red)':'inherit'}">${crit.length}</div><div class="sm mut">fällig innert 7 Tagen oder überfällig</div></div>
   <div class="card kpi"><div class="l">Zu prüfen</div><div class="v">${R.filter(r=>r.status==='zu_pruefen').length}</div><div class="sm mut">Einträge mit unbestätigten Angaben</div></div>
   <div class="card kpi"><div class="l">Dokumente</div><div class="v">${S.docs.length-miss} / ${S.docs.length}</div><div class="sm mut">${miss} Verweise ohne hochgeladene Datei</div></div>
  </div>
  <div class="note">Offene Zahlungen sind nur die erfassten Einzelbeträge. Sie sind kein bestätigter Gesamtschuldenstand; Salden mit Status «Zu prüfen» sind nicht bestätigt.</div>
  <div class="cols">
   <div class="card"><h2>Heute fällig und überfällig</h2>${tbl(todayL,'Nichts fällig.')}</div>
   <div class="card"><h2>Diese Woche</h2>${tbl(weekL,'Keine weiteren Fälligkeiten diese Woche.')}
     <h3 style="margin-top:12px">Wiederkehrend</h3>${rec.length?rec.map(r=>`<div class="sm" style="padding:5px 0;border-bottom:1px solid var(--line)">${fd(r.next_due)} · ${esc(r.title)} <span class="mut">(${esc(r.responsible||'')})</span></div>`).join(''):'<p class="mut sm">Keine.</p>'}</div>
   <div class="card"><h2>Priorität 1 ohne Fälligkeit</h2>${tbl(p1,'Keine.')}</div>
   <div class="card"><h2>Events und Eventabrechnungen</h2>${tbl(ev.slice().sort((a,b)=>(b.due_date||'').localeCompare(a.due_date||'')).slice(0,6),'Keine Events.')}</div>
   ${admin()?`<div class="card"><h2>Einnahmen und Ausgaben (Bank)</h2>${chart()}</div>`:''}
   <div class="card"><h2>E-Mail-Posteingang</h2><p class="mut sm"><a href="#email">Posteingang öffnen</a></p></div>
  </div>`);
}
function months(){const m={};S.tx.forEach(t=>{if(t.review_state==='duplikat')return;const k=t.booking_date.slice(0,7);m[k]??={in:0,out:0};+t.amount_chf>=0?m[k].in+=+t.amount_chf:m[k].out-=+t.amount_chf});return m}
function chart(){const m=months(),ks=Object.keys(m).sort().slice(-8);if(!ks.length)return '<p class="mut sm">Noch keine Bankbewegungen importiert.</p>';const mx=Math.max(...ks.map(k=>Math.max(m[k].in,m[k].out)),1);
  return `<div class="chart">${ks.map(k=>`<div class="m"><div class="bars"><i class="in" style="height:${m[k].in/mx*120}px" title="Einnahmen ${chf(m[k].in)}"></i><i class="out" style="height:${m[k].out/mx*120}px" title="Ausgaben ${chf(m[k].out)}"></i></div><span class="sm mut">${k.slice(5)}.${k.slice(2,4)}</span></div>`).join('')}</div><p class="sm mut"><span style="color:var(--grn)">■</span> Einnahmen <span style="color:var(--red)">■</span> Ausgaben</p>`}

/* ---------- Listen (Aufgaben, Events, Lieferanten, Personal) ---------- */
const VIEWS={aufgaben:{t:'Aufgaben',c:['aufgabe','dokument'],n:'aufgabe'},events:{t:'Events',c:['event'],n:'event'},lieferanten:{t:'Lieferanten, Verträge und Zahlungen',c:['lieferant','vertrag','zahlung'],n:'lieferant'},personal:{t:'Personal',c:['personal'],n:'personal'}};
function vList(key){
  const V=VIEWS[key],f=S.f[key]??={q:'',st:'',pr:'',who:'',done:false};
  let a=S.records.filter(r=>V.c.includes(r.category)||(key==='personal'&&/lohn|vertr[aä]g|stunden|zwischenverdienst/i.test(r.title)&&r.category!=='vertrag'&&r.category!=='lieferant'));
  const q=f.q.toLowerCase();
  a=a.filter(r=>(!q||(r.title+' '+r.notes+' '+(r.responsible||'')).toLowerCase().includes(q))&&(!f.st||r.status===f.st)&&(!f.pr||r.priority===f.pr)&&(!f.who||(r.responsible||'').includes(f.who))&&(f.done||f.st||open(r)));
  a.sort((x,y)=>(PR[x.priority]||9)-(PR[y.priority]||9)||(x.due_date||'9').localeCompare(y.due_date||'9'));
  const rec=key==='aufgaben'?`<div class="card" style="margin-top:14px"><h2>Wiederkehrende Aufgaben</h2><div class="tw"><table><tr><th>Nächste Fälligkeit</th><th>Aufgabe</th><th>Rhythmus</th><th>Verantwortlich</th><th></th></tr>${S.recurring.filter(r=>r.active).map(r=>`<tr><td class="num">${fd(r.next_due)}</td><td>${esc(r.title)}<div class="mut sm">${esc(r.notes)}</div></td><td>${r.cadence==='weekly'?'wöchentlich':'monatlich'}</td><td>${esc(r.responsible||'')}</td><td>${admin()?`<button class="btn xs sec" onclick="recDone('${r.id}')">Erledigt, weiter</button>`:''}</td></tr>`).join('')}</table></div></div>`:'';

function parseBfpos(txt){
  const rows=csvRows(txt.replace(/^\ufeff/,''),','),K={quelle:'bfpos',methoden:[],mwst:[],produkte:[]},f=v=>{const n=parseFloat(v);return isNaN(n)?0:n};let sec='';
  for(const r of rows){const a=(r[0]||'').trim();if(!a){sec='';continue}
    if(a==='Methode'||a==='Satz'||a==='Produkt'){sec=a;continue}
    if(sec==='Methode'){K.methoden.push({methode:a,anzahl:f(r[1]),netto:f(r[2]),trinkgeld:f(r[3]),total:f(r[4])});continue}
    if(sec==='Satz'){K.mwst.push({satz:a,modus:r[1],brutto:f(r[2]),mwst:f(r[3]),netto:f(r[4])});continue}
    if(sec==='Produkt'){K.produkte.push({name:a,menge:f(r[1]),umsatz:f(r[2])});continue}
    if(a==='Tagesabschluss')K.betrieb=r[1];else if(a==='Terminal')K.terminal=r[1];else if(/^Zeitraum/.test(a)){K.von=r[1];K.bis=r[2]}else if(/^Abschluss/.test(a))K.abschluss=parseInt(r[1],10);
    else if(/^BAR/.test(a))K.bar=f(r[1]);else if(/^UNBAR/.test(a))K.unbar=f(r[1]);else if(/^Sonstige/.test(a))K.sonstige=f(r[1]);else if(/^Umsatz/.test(a))K.netto=f(r[1]);else if(a==='Trinkgeld')K.trinkgeld=f(r[1]);else if(a==='Belege')K.belege=f(r[1]);else if(/^Total/.test(a))K.brutto=f(r[1])}
  if(K.von&&!isNaN(new Date(K.von)))K.datum=new Date(K.von).toLocaleDateString('sv-SE',{timeZone:'Europe/Zurich'});
  ['bar','unbar','sonstige','netto','trinkgeld','brutto'].forEach(k=>K[k]??=0);
  const c=(x,y)=>Math.abs(x-y)<0.006;
  K.ok=K.abschluss>0&&!!K.datum&&c(K.bar+K.unbar+K.sonstige,K.netto)&&c(K.netto+K.trinkgeld,K.brutto)&&(!K.produkte.length||c(K.produkte.reduce((s,p)=>s+p.umsatz,0),K.netto));
  return K;
}
async function kasseAdd(K){
  if(!K||!(K.abschluss>0)||!K.datum){toast('Tagesabschluss nicht lesbar',1);return false}
  if(!K.ok&&!confirm('Abschluss #'+K.abschluss+': Die Summen in der Datei gehen nicht auf. Trotzdem übernehmen?'))return false;
  let evs=S.records.filter(r=>r.category==='event'&&r.due_date===K.datum),ev=evs[0];
  if(evs.length>1){const n=prompt('Am '+fd(K.datum)+' gibt es mehrere Events. Zu welchem gehört der Abschluss #'+K.abschluss+' ('+chf(K.brutto)+')?\n\n'+evs.map((e,i)=>(i+1)+') '+e.title).join('\n')+'\n\nNummer eingeben:','1');ev=evs[+n-1];if(!ev)return false}
  if(!ev){const r=await sb.from('lp_records').insert({category:'event',title:'Event '+fd(K.datum)+' (aus Tagesabschluss)',status:'zu_pruefen',priority:'mittel',due_date:K.datum,responsible:'Levent',notes:'Automatisch aus BF-POS-Tagesabschluss angelegt. Eventname und weitere Angaben ergänzen.',details:{kassen:[K]}}).select().single();
    if(r.error){fail(r.error);return false}S.records.push(r.data);toast('Neues Event für '+fd(K.datum)+' angelegt');return true}
  const d={...(ev.details||{})},alt=d.kassen||[],ks=alt.filter(k=>!(k.abschluss===K.abschluss&&k.terminal===K.terminal));d.kassen=[...ks,K];
  const {error}=await sb.from('lp_records').update({details:d}).eq('id',ev.id);if(error){fail(error);return false}
  ev.details=d;toast('Abschluss #'+K.abschluss+(ks.length<alt.length?' aktualisiert':' übernommen')+': '+ev.title);return true;
}

const RULES=[[/stardrinks/i,'Getränke','lieferantenbestellung'],[/heineken|feldschl/i,'Getränke','lieferantenbestellung'],[/ewb|energie wasser/i,'Energie','normal'],[/axa|versicherung/i,'Versicherung','normal'],[/bernische pensionskasse|\(bpk\)/i,'Miete','normal'],[/gastrosocial|pensionskasse|ahv|ausgleichskasse/i,'Sozialversicherung','normal'],[/sumup|twint|payrexx|eventfrog|worldline/i,'Karten- und Onlineeinnahmen','normal'],[/betreibungsamt|inkasso|eos schweiz/i,'Betreibung / Inkasso','normal'],[/facebk|facebook|meta /i,'Werbung','normal'],[/kartengeb|setgeb|kontof|spesen des/i,'Bankgebühren','normal'],[/hostpoint/i,'IT','normal'],[/suisa/i,'SUISA','normal'],[/security/i,'Security','event'],[/sunrise|swisscom/i,'Telekom','normal'],[/treuhand/i,'Treuhand','normal'],[/jt intl|jti/i,'Sponsoring','normal'],[/lohn|salär|salaer/i,'Lohn','lohn'],[/bdo|miete/i,'Miete','normal']];
const pnum=s=>+String(s).replace(/['’]/g,'');
const dmy=s=>s.slice(6,10)+'-'+s.slice(3,5)+'-'+s.slice(0,2);
const SKIP=[/^Valiant Bank AG$/,/^Bundesplatz 4$/,/^3001 Bern$/,/^CHE-[\d.]+ MWST$/,/^(Datum\/Zeit|Vertrag|Konto|IBAN|Bezeichnung|Inhaber\/in)\s/,/^Kontoauszug$/,/^Datum\s+Buchungstext/,/Angaben ohne Gewähr/,/^Seite \d+/];
function parseValiant(lines){
  const R={rows:[],warn:[]},T=/^(\d\d\.\d\d\.\d{4})\s+(.*?)\s*(\d\d\.\d\d\.\d{4})\s+(-?[\d'’]+\.\d\d)\s+(-?[\d'’]+\.\d\d)$/,G=/^(\d\d\.\d\d\.\d{4})\s+(.*)\s+(\d\d\.\d\d\.\d{4})\s+(-?[\d'’]+\.\d\d)\s+(-?[\d'’]+\.\d\d)$/;
  let prev=null,cur=null;const tx=[];
  for(let l of lines){l=l.replace(/\s+/g,' ').trim();if(!l)continue;let m;
    if(m=l.match(/^Anfangssaldo per (\S+) CHF (-?[\d'’.]+)/)){if(R.start==null){R.start=pnum(m[2]);R.startDate=dmy(m[1]);prev=R.start}continue}
    if(m=l.match(/^Schlusssaldo per (\S+) CHF (-?[\d'’.]+)/)){R.end=pnum(m[2]);R.endDate=dmy(m[1]);continue}
    if(m=l.match(/^Belastungen CHF ([\d'’.]+)/)){R.deb=pnum(m[1]);continue}
    if(m=l.match(/^Gutschriften CHF ([\d'’.]+)/)){R.cre=pnum(m[1]);continue}
    if(SKIP.some(x=>x.test(l)))continue;
    if(m=l.match(G)||l.match(T)){const a=pnum(m[4]),s=pnum(m[5]);let sign=0;
      if(prev!=null){const d=Math.round((s-prev)*100)/100;if(Math.abs(Math.abs(d)-a)<0.006)sign=d<0?-1:1}
      if(!sign){sign=-1;R.warn.push('Vorzeichen unklar: '+m[1]+' '+m[2]+' '+m[4])}
      prev=s;cur={date:dmy(m[1]),val:dmy(m[3]),title:m[2].trim(),amt:a*sign,bal:s,det:[]};tx.push(cur);continue}
    if(cur)cur.det.push(l);
  }
  const LAB=/^(Begünstigter|Auftraggeber|Begünstigtenkonto|Betrag|Mitteilung \/ Referenz|Spesen)$/;
  const info=d=>{let p='',mi=[],b=null;for(let i=0;i<d.length;i++){if(/^(Begünstigter|Auftraggeber)$/.test(d[i])&&!p)p=d[i+1]||'';if(d[i]==='Betrag'&&b==null){const x=(d[i+1]||'').match(/^CHF (-?[\d'’.]+)$/);if(x)b=pnum(x[1])}if(d[i]==='Mitteilung / Referenz'){for(let j=i+1;j<d.length&&!LAB.test(d[j]);j++)mi.push(d[j])}}return{p,m:mi.join(' ').slice(0,90),b}};
  for(const t of tx){
    const title=t.title.replace(/ - \d\d\.\d\d\.\d{4}$/,''),blocks=[];let c=null;
    for(const x of t.det){if(/^(Begünstigter|Auftraggeber)$/.test(x)){c=[];blocks.push(c)}if(c)c.push(x)}
    const mk=(amt,det,bal,key,note)=>{const i=info(det),desc=[title,i.p,/^(Zahlung|Kartengeb)/.test(title)?'':i.m].filter(Boolean).join(' · '),r=RULES.find(x=>x[0].test(desc));
      return{booking_date:t.date,value_date:t.val,description:desc,amount_chf:amt,balance_chf:bal,category:r?r[1]:'unkategorisiert',kind:r?r[2]:'normal',review_state:'zu_pruefen',dedupe_key:key,notes:note||''}};
    const base='b|'+t.date+'|'+t.amt.toFixed(2)+'|'+t.bal.toFixed(2),parts=blocks.map(b=>info(b).b);
    if(blocks.length>1&&parts.every(x=>x!=null)&&Math.abs(parts.reduce((a,x)=>a+x,0)-Math.abs(t.amt))<0.006)
      blocks.forEach((b,i)=>R.rows.push(mk(parts[i]*Math.sign(t.amt),b,i===blocks.length-1?t.bal:null,base+'|p'+(i+1),'Teil '+(i+1)+'/'+blocks.length+' einer Sammelzahlung über CHF '+Math.abs(t.amt).toFixed(2))));
    else R.rows.push(mk(t.amt,t.det,t.bal,base));
  }
  const live=R.rows,sd=live.filter(r=>r.amount_chf<0).reduce((a,r)=>a-r.amount_chf,0),sc=live.filter(r=>r.amount_chf>0).reduce((a,r)=>a+r.amount_chf,0);
  R.sumDeb=Math.round(sd*100)/100;R.sumCre=Math.round(sc*100)/100;
  R.ok=R.deb!=null&&R.cre!=null&&Math.abs(R.sumDeb-R.deb)<0.006&&Math.abs(R.sumCre-R.cre)<0.006&&R.end!=null&&prev!=null&&Math.abs(prev-R.end)<0.006;
  return R;
}
async function pdfLines(pdf){
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){const tc=await(await pdf.getPage(p)).getTextContent(),rows=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const x=it.transform[4],y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<2.5);if(!r)rows.push(r={y,it:[]});r.it.push({x,w:it.width,s:it.str})}
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){r.it.sort((a,b)=>a.x-b.x);let s='',end=null;for(const i of r.it){s+=(end!=null&&i.x-end>1.2?' ':'')+i.s;end=i.x+i.w}out.push(s)}
  }
  return out;
}

async function importPdf(file){
  try{
    if(!window.pdfjsLib){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=ok;s.onerror=()=>no(new Error('PDF-Modul konnte nicht geladen werden'));document.head.appendChild(s)});

    if(!S.docs.some(d=>d.file_name===file.name&&+d.size_bytes===file.size&&d.storage_path)){const p=spath('Bankauszüge',file.name),u=await sb.storage.from('lp-dokumente').upload(p,file,{contentType:'application/pdf'});

    if(!R.rows.length)return toast('Im PDF wurden keine Buchungen erkannt. Die Datei liegt im Archiv; bitte an Claude senden.',1);
    R.rows.forEach(r=>r.source_file=file.name);

    <div class="note ${R.ok?'':'red'}">${R.ok?'Kontrolle bestanden: Die gelesenen Buchungen ergeben genau die Summen und den Schlusssaldo des Auszugs.':'<b>Kontrolle nicht bestanden.</b> Die gelesenen Summen weichen vom Auszug ab. Bitte nicht importieren und die Datei an Claude senden.'}</div>
    <table><tr><th></th><th class="r">Laut Auszug</th><th class="r">Gelesen</th></tr><tr><td>Belastungen</td><td class="num r">${chf(R.deb)}</td><td class="num r">${chf(R.sumDeb)}</td></tr><tr><td>Gutschriften</td><td class="num r">${chf(R.cre)}</td><td class="num r">${chf(R.sumCre)}</td></tr><tr><td>Schlusssaldo per ${fd(R.endDate)}</td><td class="num r">${chf(R.end)}</td><td></td></tr></table>
    <p class="sm">${R.rows.length} Buchungen (Sammelzahlungen sind in Einzelzahlungen aufgeteilt), davon <b>${neu} neu</b>. Alle werden als «Zu prüfen» eingetragen.</p>${R.warn.length?`<div class="note red sm">${R.warn.map(esc).join('<br>')}</div>`:''}
    <div class="tw" style="max-height:38vh;overflow:auto"><table>${R.rows.map(r=>`<tr><td class="num sm">${fd(r.booking_date)}</td><td class="sm">${esc(r.description)}<div class="mut">${esc(r.category)}</div></td><td class="num r sm" style="color:${r.amount_chf<0?'var(--red)':'var(--grn)'}">${chf(r.amount_chf)}</td></tr>`).join('')}</table></div>
    <div class="bar" style="justify-content:flex-end"><button class="btn sec" value="x">Abbrechen</button><button class="btn" value="s">${neu} Buchungen importieren</button></div></form>`;
    $('#pf').onsubmit=async e=>{if(e.submitter?.value!=='s')return;e.preventDefault();dlg.close();await saveTx(R.rows,R.end!=null?{as_of:R.endDate,amount_chf:R.end,source:'Valiant-Kontoauszug '+file.name}:null)};

  ['#dq','#dc','#ds','#df','#dt'].forEach(s=>$(s).onchange=set);
}
const safe=n=>n.normalize('NFKD').replace(/[^\w.\-]+/g,'_').slice(-90);
const spath=(cat,name)=>(DOCCAT[cat]||'sonstiges')+'/'+crypto.randomUUID().slice(0,8)+'-'+safe(name);
async function upload(){
  const fs=[...$('#up').files],cat=$('#upc').value,dd=$('#upd').value||null;if(!fs.length)return toast('Bitte Datei wählen',1);let ok=0;
  for(const f of fs){const p=spath(cat,f.name);const u=await sb.storage.from('lp-dokumente').upload(p,f,{contentType:f.type});if(u.error){fail(u.error);continue}
    const {error}=await sb.from('lp_documents').insert({library_file_id:'upload_'+crypto.randomUUID(),file_name:f.name,category:cat,state:'in_supabase',storage_path:p,doc_date:dd,modified_on:today(),size_bytes:f.size});error?fail(error):ok++}
  if(ok){toast(ok+' Datei(en) hochgeladen');refresh()}
}
function docAttach(i){const d=S.docs[i],inp=$('#att');inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const p=spath(d.category,f.name);const u=await sb.storage.from('lp-dokumente').upload(p,f,{contentType:f.type});if(u.error)return fail(u.error);
  const {error}=await sb.from('lp_documents').update({storage_path:p,state:'in_supabase',size_bytes:f.size}).eq('library_file_id',d.library_file_id);error?fail(error):(toast('Datei hinterlegt'),refresh())};inp.click()}
async function docMissing(i){const d=S.docs[i];if(!confirm('«'+d.file_name+'» als fehlend markieren?'))return;const {error}=await sb.from('lp_documents').update({state:'missing'}).eq('library_file_id',d.library_file_id);error?fail(error):refresh()}
async function docOpen(i,dl){const d=S.docs[i],w=dl?null:window.open('','_blank');const {data,error}=await sb.storage.from('lp-dokumente').createSignedUrl(d.storage_path,300,dl?{download:d.file_name}:undefined);
  if(error){w&&w.close();return toast('Kein Zugriff auf diese Datei: '+error.message,1)}dl?location.href=data.signedUrl:w.location=data.signedUrl}

/* ---------- Kalender ---------- */
function vCal(){
  const ws=S.f.ws??=monday(today()),t=today(),dn=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const up=S.records.filter(r=>open(r)&&r.due_date&&r.due_date>addDays(ws,6)).slice(0,15);
  M(`<h1>Kalender</h1><div class="bar"><button class="btn sec" onclick="S.f.ws=addDays(S.f.ws,-7);vCal()">‹ Woche zurück</button><button class="btn sec" onclick="S.f.ws=monday(today());vCal()">Heute</button><button class="btn sec" onclick="S.f.ws=addDays(S.f.ws,7);vCal()">Woche vor ›</button><b>${fd(ws)} – ${fd(addDays(ws,6))}</b></div>
  <div class="week">${dn.map((n,i)=>{const d=addDays(ws,i);return `<div class="day${d===t?' today':''}"><div class="d">${n} ${fd(d).slice(0,6)}</div>${S.records.filter(r=>r.due_date===d||r.remind_on===d).map(r=>`<div class="ev" onclick="editRec('${r.id}')">${r.remind_on===d&&r.due_date!==d?'⏰ ':''}${esc(r.title)}</div>`).join('')}${S.recurring.filter(r=>r.active&&r.next_due===d).map(r=>`<div class="ev rec" onclick="location.hash='aufgaben'">↻ ${esc(r.title)}</div>`).join('')}</div>`}).join('')}</div>
  <div class="card" style="margin-top:14px"><h2>Danach fällig</h2>${up.length?up.map(r=>`<div class="sm" style="padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="editRec('${r.id}')">${fd(r.due_date)} · ${esc(r.title)} <span class="mut">(${esc(r.responsible||'–')})</span></div>`).join(''):'<p class="mut sm">Keine späteren Fälligkeiten erfasst.</p>'}</div>`);
}

/* ---------- E-Mail / Protokoll ---------- */
function vMail(){
  if(!admin())return M('<h1>E-Mail-Posteingang</h1><div class="note">Nur für Admin sichtbar.</div>');
  M(`<h1>E-Mail-Posteingang</h1><p class="mut">Hostpoint-Postfach, nur lesend. Es werden keine E-Mails verändert, gelöscht oder versendet.</p><div class="bar"><button class="btn" onclick="mailLoad()">Posteingang laden</button></div><div id="mbox"></div>`);
  if(S.mail)mailShow();
}
async function mailLoad(){
  $('#mbox').innerHTML='<p class="mut">Verbinde mit Hostpoint…</p>';
  const {data,error}=await sb.functions.invoke('lp-mail',{body:{limit:40}});let d=data;
  if(error){try{d=await error.context.json()}catch(_){d={error:error.message}}}
  if(d?.error==='not_configured')return $('#mbox').innerHTML='<div class="note">Das Postfach ist noch nicht verbunden. In Supabase müssen zuerst die Secrets <b>HOSTPOINT_USER</b> und <b>HOSTPOINT_PASS</b> hinterlegt werden.</div>';
  if(d?.error)return $('#mbox').innerHTML='<div class="note red"><b>Verbindung fehlgeschlagen:</b> '+esc(d.error)+'</div>';
  S.mail=d;mailShow();
}
function mailShow(){
  const d=S.mail,inv=m=>/rechnung|invoice|faktura|mahnung|zahlungserinnerung|betreibung/i.test(m.subject)||m.attachments.some(a=>/pdf/i.test(a.type+a.name));
  $('#mbox').innerHTML=`<div class="card"><h2>${esc(d.mailbox)} · ${d.total} E-Mails im Posteingang, die neuesten ${d.messages.length}</h2><div class="tw"><table><tr><th>Datum</th><th>Absender</th><th>Betreff</th><th>Anhänge</th></tr>
  ${d.messages.map(m=>`<tr><td class="num sm">${m.date?new Date(m.date).toLocaleString('de-CH',{dateStyle:'short',timeStyle:'short'}):''}</td><td>${m.seen?'':'<b>'}${esc(m.from_name||m.from_address)}${m.seen?'':'</b>'}<div class="sm mut">${esc(m.from_address)}</div></td><td>${esc(m.subject)} ${inv(m)?'<span class="b zu_pruefen">mögliche Rechnung</span>':''}</td><td class="sm">${m.attachments.map(a=>esc(a.name)).join('<br>')}${m.attachments.some(a=>/pdf|jpe?g|png|csv/i.test(a.type+a.name))?`<br><button class="btn xs" onclick="mailTake(${+m.uid})">Ins Archiv</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Keine E-Mails.</td></tr>'}</table></div></div>`;
}
async function ensurePdf(){if(window.pdfjsLib)return;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=ok;s.onerror=()=>no(new Error('PDF-Modul konnte nicht geladen werden'));document.head.appendChild(s)});pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
function invGuess(lines){
  const A=/(?:CHF|Fr\.|SFr\.?)\s*(\d{1,3}(?:['’ ]?\d{3})*[.,]\d{2})(?!\d)|(\d{1,3}(?:['’ ]?\d{3})*[.,]\d{2})\s*(?:CHF|Fr\.)/gi,K=/total|gesamt|rechnungsbetrag|zu (be)?zahlen|zahlbetrag|endbetrag|offener betrag|betrag inkl|währung betrag/i;
  let amt=null,due=null;
  lines.forEach((l,i)=>{const t=l+' '+(lines[i+1]||'');if(K.test(l))for(const m of t.matchAll(A)){const n=num(m[1]||m[2]);if(!isNaN(n)&&(amt==null||n>amt))amt=n}
    if(!due){const m=t.match(/(zahlbar bis|fällig(?:keit)?(?: am| bis)?|zahlungsfrist(?: bis)?|bis spätestens|zahlungsziel)\D{0,20}(\d{1,2}\.\d{1,2}\.\d{2,4})/i);if(m)due=pdate(m[2])}});
  return{amt,due};
}
async function mailTake(uid){
  toast('Anhänge werden geholt…');
  const {data,error}=await sb.functions.invoke('lp-mail',{body:{action:'attachments',uid}});let d=data;
  if(error){try{d=await error.context.json()}catch(_){d={error:error.message}}}
  if(d?.error)return toast('Fehler: '+d.error,1);
  const from=d.from_name||d.from_address,when=d.date?iso(new Date(d.date)):today(),src='E-Mail von '+from+' <'+d.from_address+'> vom '+fd(when)+': '+d.subject;let done=0;
  for(const f of d.files){
    if(f.skipped){toast(f.name+': '+f.skipped,1);continue}
    const bytes=Uint8Array.from(atob(f.b64),c=>c.charCodeAt(0)),key='mail-'+uid+'-'+safe(f.name),pos=/bfpos/i.test(d.from_address)||/^tagesabschluss/i.test(f.name),cat=pos?'Eventabrechnungen':'Lieferantenrechnungen';
    if(/\.csv$/i.test(f.name)){if(pos&&await kasseAdd(parseBfpos(new TextDecoder().decode(bytes))))done++;continue}
    let doc=S.docs.find(x=>x.file_name===f.name&&+x.size_bytes===bytes.length&&x.storage_path);
    if(!doc){const p=spath(cat,f.name),u=await sb.storage.from('lp-dokumente').upload(p,new Blob([bytes],{type:f.type}),{contentType:f.type});if(u.error){fail(u.error);continue}
      const r=await sb.from('lp_documents').insert({library_file_id:'mail_'+crypto.randomUUID(),file_name:f.name,category:cat,state:'in_supabase',storage_path:p,doc_date:when,modified_on:today(),size_bytes:bytes.length,notes:src.slice(0,300)}).select().single();
      if(r.error){fail(r.error);continue}doc=r.data}
    done++;
    if(pos||S.records.some(r=>r.source_key===key)||doc.record_id)continue;
    let g={amt:null,due:null};
    if(f.type==='application/pdf'){try{await ensurePdf();g=invGuess(await pdfLines(await pdfjsLib.getDocument({data:bytes.slice()}).promise))}catch(e){console.warn(e)}}
    if(!confirm('«'+f.name+'» liegt im Archiv.\n\nAls Rechnungsentwurf «Zu prüfen» erfassen?\nAbsender: '+from+'\nBetrag (aus PDF gelesen, ungeprüft): '+(g.amt!=null?chf(g.amt):'nicht erkannt')+'\nFällig: '+(g.due?fd(g.due):'nicht erkannt')))continue;
    const r=await sb.from('lp_records').insert({source_key:key,category:'zahlung',title:'Rechnung '+from,status:'zu_pruefen',priority:'mittel',amount_chf:g.amt,due_date:g.due,responsible:'Arben',evidence:f.name,notes:'Entwurf aus '+src.slice(0,250)+'. Betrag und Fälligkeit automatisch aus dem PDF gelesen und nicht bestätigt. Keine Zahlung ausgelöst.',details:{quelle:'email',absender:d.from_address}}).select('id').single();
    if(r.error){fail(r.error);continue}
    await sb.from('lp_documents').update({record_id:r.data.id}).eq('library_file_id',doc.library_file_id);
  }
  if(!done)toast('Keine passenden Anhänge gefunden');await load();
}
function vLog(){
  const lab={insert:'Neu',update:'Geändert',delete:'Gelöscht'},tn={lp_records:'Eintrag',lp_recurring:'Wiederkehrend',lp_documents:'Dokument',lp_bank_tx:'Bankbuchung',lp_bank_balance:'Kontostand'};
  M(`<h1>Änderungsprotokoll</h1><p class="mut">Jede Änderung wird automatisch mit Zeitpunkt und altem/neuem Wert gespeichert. Angezeigt werden die letzten 150.</p><div class="card"><div class="tw"><table><tr><th>Zeit</th><th>Bereich</th><th>Aktion</th><th>Betroffen</th><th>Geänderte Felder</th></tr>
  ${S.changes.map(c=>{const a=c.after_value||{},b=c.before_value||{},ch=c.action==='update'?Object.keys(a).filter(k=>k!=='updated_at'&&JSON.stringify(a[k])!==JSON.stringify(b[k])):[];
   return `<tr><td class="num sm">${new Date(c.changed_at).toLocaleString('de-CH')}</td><td>${esc(tn[c.table_name]||c.table_name||'')}</td><td>${esc(lab[c.action]||c.action)}</td><td>${esc(a.title||b.title||a.file_name||b.file_name||a.description||b.description||'')}</td><td class="sm">${ch.map(k=>`${esc(k)}: ${esc(JSON.stringify(b[k])).slice(0,60)} → ${esc(JSON.stringify(a[k])).slice(0,60)}`).join('<br>')}</td></tr>`}).join('')||'<tr><td colspan="5" class="mut">Noch keine Änderungen.</td></tr>'}</table></div></div>`);
}
boot();
