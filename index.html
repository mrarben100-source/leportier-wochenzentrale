<script>
const sb = supabase.createClient('https://pvrvhkyvnlafipbmidon.supabase.co','sb_publishable_dE2ZMkj9nEFy7lJ4miiTVw_5wvggHC_');
const $=s=>document.querySelector(s), root=$('#root'), dlg=$('#dlg');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const EVF=[['veranstalter','Veranstalter'],['verantwortlich','Verantwortliche'],['dj','DJ'],['security','Security'],['bar','Bar'],['garderobe','Garderobe'],['personalstunden','Personalstunden','n'],['ein_ticket','Ticketeinnahmen CHF','n'],['ein_karte','Karteneinnahmen CHF','n'],['ein_twint','TWINT-Einnahmen CHF','n'],['ein_bar','Bareinnahmen CHF','n'],['kosten_getraenke','Getränkekosten CHF','n'],['kosten_weitere','Weitere Ausgaben CHF','n'],['kosten_personal','Personalkosten CHF (Stempeluhr)','n'],['fehlende_belege','Fehlende Belege'],['freigabe','Zahlungsfreigabe']];
const DC='library_file_id,file_name,category,state,modified_on,size_bytes,notes,created_at,storage_path,record_id,doc_date,content_at';
let S={user:null,role:null,records:[],recurring:[],docs:[],tx:[],bal:[],changes:[],f:{}};

const fail=e=>{console.error(e);toast('Fehler: '+(e.message||e),1)};

const opts=(o,sel,all)=>(all?`<option value="">${all}</option>`:'')+Object.entries(o).map(([k,v])=>`<option value="${esc(k)}"${k===sel?' selected':''}>${esc(v)}</option>`).join('');

/* ---------- Anmeldung ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return loginView();
  S.user=session.user;
  const {data:m}=await sb.from('lp_members').select('role,display_name').eq('user_id',S.user.id).maybeSingle();
  if(!m||m.role==='pending')return pendingView(m);
  S.role=m.role;S.name=m.display_name||S.user.email;
  await load();shell();route();live();setTimeout(pushAsk,1500);autoMail();autoBexio();setInterval(autoBexio,1800000);setInterval(autoMail,120000);calLoad(true);setInterval(()=>calLoad(true),900000);
}
function pendingView(m){
  root.innerHTML=`<div class="login"><div class="card"><h1>Zugang noch nicht freigeschaltet</h1><p>Angemeldet als <b>${esc(S.user.email)}</b>.</p>
  ${m?`<div class="note">Deine Anfrage ist gesendet. Ein Administrator muss dich im Dashboard unter «Protokoll → Benutzer» freischalten.</div><button class="btn" onclick="boot()">Erneut prüfen</button>`
     :`<p class="mut sm">Trag deinen Namen ein und sende die Anfrage. Danach schaltet dich ein Administrator frei.</p><input id="pn" placeholder="Vorname (z. B. Levent)"><button class="btn" id="pb">Zugang anfragen</button>`}
  <button class="btn sec" onclick="logout()">Abmelden</button></div></div>`;
  if(!m)$('#pb').onclick=async()=>{const n=$('#pn').value.trim();if(!n)return toast('Bitte Namen eintragen',1);const {error}=await sb.from('lp_members').insert({user_id:S.user.id,role:'pending',display_name:n});error?fail(error):boot()};
}
function live(){
  sb.channel('lp-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'lp_changes'},()=>S.dirty=true).on('postgres_changes',{event:'INSERT',schema:'public',table:'lp_comments'},()=>S.dirty=true).subscribe();
  setInterval(async()=>{if(!S.dirty||S.autoBusy||dlg.open||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;S.dirty=false;await load();route()},2500);
}
const nameOf=id=>id?(S.members.find(m=>m.user_id===id)?.display_name||(id===S.user.id?S.name:'Benutzer')):'System / ChatGPT';
const mine=r=>{const n=(S.name||'').split(/[\s@]/)[0];return n.length>1&&new RegExp('(^|[^\\p{L}])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^\\p{L}])','iu').test(r.responsible||'')};
function loginView(msg){
  root.innerHTML=`<div class="login"><div class="card"><h1>Le Portier N°35</h1><p class="mut">Wochenzentrale – Anmeldung</p>
  ${msg?`<div class="note">${esc(msg)}</div>`:''}
  <input id="le" type="email" placeholder="E-Mail" autocomplete="username"><input id="lp" type="password" placeholder="Passwort (mind. 8 Zeichen)" autocomplete="current-password">
  <button class="btn" id="li">Anmelden</button><button class="btn sec" id="lr">Neues Konto registrieren</button>
  <button class="btn sec" id="lf">Passwort vergessen</button></div></div>`;
  const cred=()=>({email:$('#le').value.trim(),password:$('#lp').value});
  $('#li').onclick=async()=>{const {error}=await sb.auth.signInWithPassword(cred());error?toast('Anmeldung fehlgeschlagen: '+error.message,1):boot()};
  $('#lp').onkeydown=e=>{if(e.key==='Enter')$('#li').click()};
  $('#lr').onclick=async()=>{const c=cred();if(c.password.length<8)return toast('Passwort mindestens 8 Zeichen',1);const {data,error}=await sb.auth.signUp({...c,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return fail(error);data.session?boot():loginView('Konto erstellt. Bitte den Link in der Bestätigungs-E-Mail anklicken und danach hier anmelden.')};
  $('#lf').onclick=async()=>{const e=$('#le').value.trim();if(!e)return toast('E-Mail eintragen',1);const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});error?fail(error):toast('E-Mail zum Zurücksetzen gesendet')};
}
async function logout(){await sb.auth.signOut();location.hash='';location.reload()}
sb.auth.onAuthStateChange(async ev=>{if(ev==='PASSWORD_RECOVERY'){const p=prompt('Neues Passwort (mind. 8 Zeichen):');if(p&&p.length>=8){const {error}=await sb.auth.updateUser({password:p});error?fail(error):toast('Passwort geändert')}}});

/* Supabase liefert höchstens 1000 Zeilen pro Abfrage → grosse Tabellen seitenweise laden */
async function all(mk){let out=[];for(let f=0;;f+=1000){const r=await mk().range(f,f+999);if(r.error)return {error:r.error,data:out};out=out.concat(r.data||[]);if(!r.data||r.data.length<1000)return {data:out}}}
async function load(){
  const q=[all(()=>sb.from('lp_records').select('*').order('due_date',{nullsFirst:false}).order('id')),sb.from('lp_recurring').select('*').order('next_due'),all(()=>sb.from('lp_documents').select(DC).order('file_name').order('library_file_id')),
    all(()=>sb.from('lp_bank_tx').select('*').order('booking_date',{ascending:false}).order('id')),sb.from('lp_bank_balance').select('*').order('as_of',{ascending:false}).limit(12),
    sb.from('lp_changes').select('*').order('changed_at',{ascending:false}).limit(150)];
  const r=await Promise.all(q);const e=r.find(x=>x.error);if(e)fail(e.error);
  [S.records,S.recurring,S.docs,S.tx,S.bal,S.changes]=r.map(x=>x.data||[]);S.balAG=S.bal.filter(b=>String(b.source).startsWith('[AG]'));S.bal=S.bal.filter(b=>!String(b.source).startsWith('[AG]'));
  const mm=await sb.from('lp_members').select('user_id,role,display_name,email,requested_at');S.members=mm.data||[];
  if(S.role==='admin'){const bx=await all(()=>sb.from('lp_bexio').select('kind,bexio_id,data,synced_at').order('kind').order('bexio_id'));S.bx=bx.data||[]}
}

  ({uebersicht:vHome,aufgaben:()=>vList('aufgaben'),rechnungen:vBills,finanzen:vFin,events:()=>vList('events'),lieferanten:()=>vList('lieferanten'),bestellungen:vOrders,personal:()=>vList('personal'),dokumente:vDocs,kalender:vCal,email:vMail,bexio:vBexio,protokoll:vLog}[k]||vHome)();

const b64u=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pushSub(){try{const r=await navigator.serviceWorker.getRegistration('sw.js')||await navigator.serviceWorker.getRegistration();return r?await r.pushManager.getSubscription():null}catch(e){return null}}

/* Beim Öffnen fragen, solange Mitteilungen auf diesem Gerät nicht aktiv sind («Später» = 3 Tage Ruhe) */

function pushLater(t){try{localStorage.setItem('pushLater',String(Date.now()+t*864e5))}catch(e){}dlg.close()}
async function pushOn(){
  try{const perm=await Notification.requestPermission();if(perm!=='granted')return toast('Mitteilungen wurden nicht erlaubt',1);
    const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    const {data,error}=await sb.functions.invoke('lp-notify',{body:{action:'key'}});if(error||!data?.publicKey)throw new Error(data?.error||error?.message||'Schlüssel fehlt');
    const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(data.publicKey)});
    const j=sub.toJSON(),dev=(isIOS()?'iPhone':/android/i.test(navigator.userAgent)?'Android':'Computer')+' · '+S.name;
    const {error:e2}=await sb.from('lp_push_subs').upsert({endpoint:j.endpoint,sub:j,user_id:S.user.id,geraet:dev},{onConflict:'endpoint'});if(e2)throw e2;
    toast('Mitteilungen aktiviert');pushRefresh();
  }catch(e){console.warn(e);toast('Aktivieren fehlgeschlagen: '+(e.message||e),1)}}
async function pushTopic(id,k,on){const {data}=await sb.from('lp_push_subs').select('topics').eq('id',id).single();const t=new Set(data?.topics||[]);on?t.add(k):t.delete(k);const {error}=await sb.from('lp_push_subs').update({topics:[...t]}).eq('id',id);error?fail(error):toast('Gespeichert')}
async function pushTest(){const {data,error}=await sb.functions.invoke('lp-notify',{body:{action:'test'}});if(error||data?.error)return toast('Test fehlgeschlagen: '+(data?.error||error.message),1);toast(data.ok?'Test-Mitteilung gesendet – sollte gleich erscheinen':'Kein aktives Gerät gefunden',!data.ok)}
async function pushOff(){const sub=await pushSub();if(sub){await sb.from('lp_push_subs').delete().eq('endpoint',sub.endpoint);try{await sub.unsubscribe()}catch(e){}}toast('Mitteilungen auf diesem Gerät ausgeschaltet');pushRefresh()}
async function appUpdate(){
  try{if('caches' in window)for(const k of await caches.keys())await caches.delete(k);if(navigator.serviceWorker)for(const r of await navigator.serviceWorker.getRegistrations())if(!/\/sw\.js$/.test(r.active?.scriptURL||r.installing?.scriptURL||''))await r.unregister()}catch(e){}
  location.replace(location.pathname+'?v='+Date.now()+location.hash);
}
/* Prüfen, ob eine neue Version online ist (beim Zurückkehren in die App und alle 5 Minuten) */
const verHash=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h};
async function verCheck(){
  try{const t=await (await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'})).text(),h=verHash(t);
    if(S.ver==null){S.ver=h;return}
    if(h!==S.ver&&!$('#upd-bar')){const b=document.createElement('div');b.id='upd-bar';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:#1c1b19;color:#fff;padding:10px 14px;border-radius:12px;z-index:100;display:flex;gap:10px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:92vw';

}

/* Tabellen fürs Handy vorbereiten: jede Zelle bekommt den Spaltennamen als data-label.
   Tabellen mit weniger als 4 Spalten bleiben normale Tabellen. */
function cards(el=document){
  el.querySelectorAll('table:not([data-cards])').forEach(t=>{
    t.dataset.cards='1';
    const rows=[...t.rows],hr=rows.find(r=>r.cells.length&&[...r.cells].every(c=>c.tagName==='TH'));
    if(!hr)return;
    const lab=[];[...hr.cells].forEach(c=>{for(let i=0;i<(c.colSpan||1);i++)lab.push(c.textContent.trim())});
    if(lab.length<4&&!t.classList.contains('mc'))return;
    t.classList.add('cards');
    rows.forEach(r=>{
      if(r.cells.length&&[...r.cells].every(c=>c.tagName==='TH')){r.classList.add('hd');return}
      let col=0,first=true;
      [...r.cells].forEach(c=>{
        const span=c.colSpan||1;
        if(span>=lab.length-1||span>2){c.classList.add('wide')}
        else if(c.querySelector('button,input,select')&&!c.textContent.trim()){c.classList.add('act')}
        else if(first&&c.textContent.trim()&&!c.classList.contains('r')&&!c.classList.contains('num')&&lab[col]&&!/^(p|prio|datum|zeit|fällig)$/i.test(lab[col])){c.classList.add('t0');first=false}
        else if(lab[col])c.dataset.label=lab[col];
        col+=span;
      });
    });
  });
}
new MutationObserver(()=>{clearTimeout(cards._t);cards._t=setTimeout(()=>cards(),30)}).observe(document.body,{childList:true,subtree:true});

function parseBfpos(txt){
  const rows=csvRows(txt.replace(/^\ufeff/,''),','),K={quelle:'bfpos',methoden:[],mwst:[],produkte:[]},f=v=>{const n=parseFloat(v);return isNaN(n)?0:n};let sec='';
  for(const r of rows){const a=(r[0]||'').trim();if(!a){sec='';continue}
    if(a==='Methode'||a==='Satz'||a==='Produkt'){sec=a;continue}
    if(sec==='Methode'){K.methoden.push({methode:a,anzahl:f(r[1]),netto:f(r[2]),trinkgeld:f(r[3]),total:f(r[4])});continue}
    if(sec==='Satz'){K.mwst.push({satz:a,modus:r[1],brutto:f(r[2]),mwst:f(r[3]),netto:f(r[4])});continue}
    if(sec==='Produkt'){K.produkte.push({name:a,menge:f(r[1]),umsatz:f(r[2])});continue}
    if(a==='Tagesabschluss')K.betrieb=r[1];else if(a==='Terminal')K.terminal=r[1];else if(/^Zeitraum/.test(a)){K.von=r[1];K.bis=r[2]}else if(/^Abschluss/.test(a))K.abschluss=parseInt(r[1],10);
    else if(/^BAR/.test(a))K.bar=f(r[1]);else if(/^UNBAR/.test(a))K.unbar=f(r[1]);else if(/^Sonstige/.test(a))K.sonstige=f(r[1]);else if(/^Umsatz/.test(a))K.netto=f(r[1]);else if(a==='Trinkgeld')K.trinkgeld=f(r[1]);else if(a==='Belege')K.belege=f(r[1]);else if(/^Total/.test(a))K.brutto=f(r[1])}
  if(K.von&&!isNaN(new Date(K.von)))K.datum=new Date(K.von).toLocaleDateString('sv-SE',{timeZone:'Europe/Zurich'});
  ['bar','unbar','sonstige','netto','trinkgeld','brutto'].forEach(k=>K[k]??=0);
  const c=(x,y)=>Math.abs(x-y)<0.006;
  K.ok=K.abschluss>0&&!!K.datum&&c(K.bar+K.unbar+K.sonstige,K.netto)&&c(K.netto+K.trinkgeld,K.brutto);
  return K;
}

const ALIAS=[[/leons böden/i,'Gezim (Leons Böden)'],[/energie wasser bern/i,'EWB']];
const payee=x=>{const a=ALIAS.find(([r])=>r.test(x.description||''));if(a)return a[1];const d=x.description||'',p=d.split(' · ')[1];if(p)return p.trim();if(/^(Vergütung|Übertrag|Zahlung|Bancomat|Geldautomat|Dauerauftrag|Einzahlung|Kartengeb|Setgeb|Gebühr|Kontoführ|Saldo der|Tankomat|Gutschrift|Zins|Spesen)/i.test(d))return (d.match(/^Zahlung - (.+?) - \d\d\.\d\d\./)||[])[1]?.replace(/\s*\*.*$/,'').trim()||'';return d.split(',')[0].trim()};

const billState=r=>r.status==='erledigt'?'bezahlt':r.status==='zu_pruefen'?'pruefen':'offen';

  const sum=k=>all.filter(r=>billState(r)===k).reduce((s,r)=>s+(+r.amount_chf||0),0),cnt=k=>all.filter(r=>billState(r)===k).length,nob=k=>all.filter(r=>billState(r)===k&&r.amount_chf==null).length;
  const show=all.filter(r=>(f.v==='alle'||billState(r)===f.v)&&(!q||(firma(r)+' '+r.title+' '+r.notes).toLowerCase().includes(q)));
  const G={};show.forEach(r=>(G[firma(r)]??=[]).push(r));
  const firms=Object.entries(G).sort((a,b)=>b[1].reduce((s,r)=>s+(+r.amount_chf||0),0)-a[1].reduce((s,r)=>s+(+r.amount_chf||0),0));
  const P={};S.tx.filter(x=>+x.amount_chf<0&&konto(x)==='GmbH'&&!intern(x)&&x.review_state!=='duplikat').forEach(x=>{const n=payee(x);if(!n)return;const p=P[n]??={n:0,s:0,last:''};p.n++;p.s-=+x.amount_chf;if(x.booking_date>p.last)p.last=x.booking_date});
  const payees=Object.entries(P).filter(([n])=>!q||n.toLowerCase().includes(q)).sort((a,b)=>b[1].s-a[1].s);
  const tab=(k,l)=>`<button class="btn ${f.v===k?'':'sec'}" onclick="S.f.bill.v='${k}';vBills()">${l}</button>`;

  <div class="note">«Zu prüfen» sind Posten, deren Betrag oder Stand nicht bestätigt ist; sie sind keine gesicherte Schuld. Als bezahlt gilt ein Posten erst, wenn ihr ihn so markiert. Das Dashboard löst keine Zahlung aus.</div>

   ${rs.map(r=>{const p=paidFor(r.id),docs=S.docs.filter(x=>x.record_id===r.id).length,done=billState(r)==='bezahlt',rest=r.amount_chf==null?null:done?0:Math.max(r.amount_chf-p,0);return `<tr class="click" onclick="editRec('${r.id}')"><td>${esc(r.title)}${r.details?.bexio?' <span class="b g">Bexio</span>':''}<div class="sm mut">${esc((r.notes||'').slice(0,140))}</div></td><td class="num" style="${!done&&r.due_date&&r.due_date<t?'color:var(--red)':''}">${fd(r.due_date)}</td><td class="num r">${chf(r.amount_chf)}</td><td class="num r">${p?chf(p):'–'}</td><td class="num r"><b>${chf(rest)}</b></td><td>${sbadge(r.status)}${r.confirmed_on&&done?'<div class="sm mut">'+fd(r.confirmed_on)+'</div>':''}</td><td class="sm">${docs?docs+' Beleg'+(docs>1?'e':''):'<span style="color:var(--red)">kein Beleg</span>'}</td><td>${!done&&admin()?`<button class="btn xs sec" onclick="event.stopPropagation();billPaid('${r.id}')">Als bezahlt markieren</button>`:''}</td></tr>`}).join('')}</table></div></div>`}).join('')||'<div class="card"><p class="mut">Keine Posten in dieser Ansicht.</p></div>'}
  ${krBox(q)}
  ${admin()?`<div class="card" style="margin-top:14px"><h2>Wohin laut Bank Geld geflossen ist</h2><p class="sm mut">Ausgänge vom GmbH-Konto nach Empfänger, ohne interne Transfers. Bargeldbezüge, Gebühren und Überträge ohne Empfängerangabe sind nicht enthalten.</p><div class="tw" style="max-height:50vh;overflow:auto"><table><tr><th>Empfänger</th><th class="r">Zahlungen</th><th class="r">Total bezahlt</th><th>Letzte Zahlung</th></tr>${payees.map(([n,p])=>`<tr><td>${esc(n)}</td><td class="r">${p.n}</td><td class="num r">${chf(p.s)}</td><td class="num">${fd(p.last)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Keine Zahlungen gefunden.</td></tr>'}</table></div></div>`:''}`);

/* Gestellte Rechnungen (aus Mails übernommen, details.art 'kundenrechnung'): keine Schulden, Zahlungseingang laut Bank */
function krBox(q){const K=S.records.filter(r=>isKR(r)&&(!q||(r.title+' '+(r.details?.firma||'')).toLowerCase().includes(q))).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));if(!K.length)return'';

  return `<div class="card" style="margin-top:14px"><h2>Gestellte Rechnungen (aus Mail) <span class="b g">${op.length} offen · ${chf(op.reduce((s,r)=>s+Math.max((+r.amount_chf||0)-paidFor(r.id),0),0))}</span></h2><p class="sm mut">Rechnungen, die ihr selbst verschickt habt. Sie sind Guthaben, keine Schulden. «Bezahlt» heisst: Zahlungseingang in der Bank gefunden.</p>

async function pdfLines(pdf){

    for(const r of rows){r.it.sort((a,b)=>a.x-b.x);let s='',end=null;for(const i of r.it){s+=(end!=null&&i.x-end>1.2?' ':'')+i.s;end=i.x+i.w}out.push(s)}

}

      if(/(^|\/)__MACOSX\//.test(e.name)||name.startsWith('.'))continue;

function invGuess(lines){
  const A=/(?:CHF|Fr\.|SFr\.?)\s*(\d{1,3}(?:['’ ]?\d{3})*[.,]\d{2})(?!\d)|(\d{1,3}(?:['’ ]?\d{3})*[.,]\d{2})\s*(?:CHF|Fr\.)/gi,K=/total|gesamt|rechnungsbetrag|zu (be)?zahlen|zahlbetrag|endbetrag|offener betrag|betrag inkl|währung betrag/i;

  lines.forEach((l,i)=>{const t=l+' '+(lines[i+1]||'');if(K.test(l))for(const m of t.matchAll(A)){const n=num(m[1]||m[2]);if(!isNaN(n)&&(amt==null||n>amt))amt=n}

function mailKind(m){
  const head=(m.subject||'')+' '+(m.attachments||[]).map(a=>a.name).join(' '),all=head+' '+(m.snippet||''),from=(m.from_address||'')+' '+(m.from_name||'');

  const recOf=Object.fromEntries(S.records.filter(r=>r.details?.bexio?.kind==='bill').map(r=>[r.details.bexio.id,r]));
  for(const b of bills){

    const take=[];for(const t of pays){if(rest<=0.05)break;const a=Math.min(-t.amount_chf,rest);take.push({t,a:Math.round(a*100)/100});rest-=a;used.add(t.id)}

const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const LOHN={premium:['alicia','tuana'],satzPremium:20.44,satz:18.77,ferien:10.65,feiertag:2.27,dm:8.33,ahv:5.30,alv:1.10,ktg:1.13};

    fremd=[...new Set(d.stamps.map(s=>s.name).filter(n=>!known.has((n||'').toLowerCase().trim())))],sum=k=>rows.reduce((a,r)=>a+r.l[k],0);

  ${rows.map((r,i)=>{const doc=S.docs.find(x=>x.library_file_id==='lohn_'+d.monat+'_'+r.ma.id);return `<tr><td>${esc(r.ma.vorname)} ${esc(r.ma.nachname||'')}${r.l.isB?' <span class="b g">Quellensteuer '+r.l.qs.toFixed(2)+'%</span>':''}${r.l.offen?'<div class="sm" style="color:var(--red)">'+r.l.offen+' Einsatz ohne Ausstempeln – nicht gezählt</div>':''}</td><td class="r">${r.l.einsaetze}</td><td class="num r">${r.l.h.toFixed(2)}</td><td class="num r">${r.l.satz.toFixed(2)}</td><td class="num r">${chf(r.l.brutto)}</td><td class="num r">${chf(r.l.abz)}</td><td class="num r"><b>${chf(r.l.netto)}</b></td><td style="white-space:nowrap"><button class="btn xs" onclick="lohnPdf(${r.ma.id})">${doc?'Neu erstellen':'Abrechnung erstellen'}</button>${doc?` <button class="btn xs sec" onclick="docOpen(${S.docs.indexOf(doc)})">Ansehen</button>`:''}</td></tr>`}).join('')}
  <tr><td><b>Total ${MON[mo-1]} ${y}</b></td><td></td><td class="num r"><b>${sum('h').toFixed(2)}</b></td><td></td><td class="num r"><b>${chf(sum('brutto'))}</b></td><td class="num r"><b>${chf(sum('abz'))}</b></td><td class="num r"><b>${chf(sum('netto'))}</b></td><td><button class="btn xs sec" onclick="lohnAlle()">Alle erstellen</button></td></tr></table></div>`:'<p class="mut sm">Keine Stempelzeiten in diesem Monat.</p>'}
  ${fremd.length?`<div class="note sm">Stempelzeiten ohne Mitarbeiter-Stammdaten (keine Abrechnung möglich): ${fremd.map(esc).join(', ')}</div>`:''}
  <p class="sm mut">Berechnung wie in der Stempeluhr-Admin-App: Ansatz CHF ${LOHN.satz} (Alicia, Tuana CHF ${LOHN.satzPremium}), Ferien ${LOHN.ferien}%, Feiertage ${LOHN.feiertag}%, 13. Monatslohn ${LOHN.dm}%, AHV ${LOHN.ahv}%, ALV ${LOHN.alv}%, KTG ${LOHN.ktg}%, Quellensteuer nur bei B-Ausweis. Die Abrechnung wird als PDF im Archiv unter «Lohnabrechnungen» abgelegt. Es wird nichts ausbezahlt.</p>`;
}
async function ensureJsPdf(){if(window.jspdf)return;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=ok;s.onerror=()=>no(new Error('PDF-Modul konnte nicht geladen werden'));document.head.appendChild(s)})}
async function lohnPdf(maId,quiet){
  try{await ensureJsPdf();const d=S.st,ma=d.mitarbeiter.find(m=>m.id===maId),l=calcLohn(ma,d.stamps),[y,mo]=d.monat.split('-').map(Number),f=v=>v.toFixed(2),name=((ma.vorname||'')+' '+(ma.nachname||'')).trim();
    const doc=new jspdf.jsPDF({unit:'mm',format:'a4'}),L=18,R=192;let yy=22;
    const T=(t,x,o={})=>doc.text(String(t),x,yy,o),B=b=>doc.setFont('helvetica',b?'bold':'normal'),line=()=>{doc.setDrawColor(190);doc.line(L,yy+2,R,yy+2)};
    B(1);doc.setFontSize(14);T('Le Portier 35',L);yy+=6;B(0);doc.setFontSize(10);T('PrimeVibes GmbH',L);yy+=5;T('Aarbergergasse 35, 3011 Bern',L);
    yy+=14;B(1);doc.setFontSize(15);T('Lohnabrechnung '+MON[mo-1]+' '+y,105,{align:'center'});
    yy+=13;doc.setFontSize(9);B(1);T('Mitarbeiter',L);T('AHV-Nr.',130);B(0);T(ma.ahv_nr||'–',R,{align:'right'});
    yy+=5;doc.setFontSize(10);B(1);T(name,L);doc.setFontSize(9);T('Ausweis',130);B(0);T(ma.auslaenderausweis||'–',R,{align:'right'});
    yy+=5;T(ma.strasse||'',L);B(1);T('Geburtsdatum',130);B(0);T(ma.geburtsdatum||'–',R,{align:'right'});
    yy+=5;T(((ma.plz||'')+' '+(ma.ort||'')).trim(),L);
    yy+=12;B(1);T('Bezeichnung',L);T('Satz',118,{align:'right'});T('Pro Stunde',155,{align:'right'});T('Pro Monat',R,{align:'right'});line();B(0);
    const row=(a,b,c,e,bold)=>{yy+=7;B(bold);T(a,L);B(0);if(b)T(b,118,{align:'right'});if(c)T(c,155,{align:'right'});B(bold);T(e,R,{align:'right'});B(0)};
    row('Arbeitslohn','CHF '+f(l.satz)+'/h','CHF '+f(l.satz),'CHF '+f(l.arb));
    row('Ferienentschädigung '+f(LOHN.ferien)+'%',f(LOHN.ferien)+'%','CHF '+f(l.satz*LOHN.ferien/100),'CHF '+f(l.fer));
    row('Feiertagsentschädigung '+f(LOHN.feiertag)+'%',f(LOHN.feiertag)+'%','CHF '+f(l.satz*LOHN.feiertag/100),'CHF '+f(l.fei));
    row('13. Monatslohn '+f(LOHN.dm)+'% (auf Arb.+Ferien+Feiertag)',f(LOHN.dm)+'%','','CHF '+f(l.dm));line();
    row('Bruttolohn ('+f(l.h)+' h)','','','CHF '+f(l.brutto),1);
    yy+=10;B(1);T('Abzüge Arbeitnehmer',L);line();B(0);
    row('AHV/IV/EO '+f(LOHN.ahv)+'%',f(LOHN.ahv)+'%','','-CHF '+f(l.ahv));row('ALV '+f(LOHN.alv)+'%',f(LOHN.alv)+'%','','-CHF '+f(l.alv));row('KTG '+f(LOHN.ktg)+'%',f(LOHN.ktg)+'%','','-CHF '+f(l.ktg));
    if(l.isB)row('Quellensteuer Tarif A0N ('+f(l.qs)+'%)',f(l.qs)+'%','','-CHF '+f(l.qst));line();
    row('Total Abzüge','','','-CHF '+f(l.abz),1);
    yy+=10;doc.setFontSize(12);B(1);T('Nettolohn',L);T('CHF '+f(l.netto),R,{align:'right'});doc.setFontSize(9);
    yy+=14;B(1);T('Stunden-Übersicht',L);line();B(0);yy+=7;T('Gearbeitete Netto-Stunden',L);T(f(l.h)+' h',R,{align:'right'});
    yy=285;doc.setFontSize(8);doc.setTextColor(110);T('Zahltag '+new Date(y,mo,1).toLocaleDateString('de-CH')+' | Le Portier 35 / PrimeVibes GmbH, Aarbergergasse 35, 3011 Bern',105,{align:'center'});
    const blob=doc.output('blob'),fn='Lohnabrechnung_'+MON[mo-1]+'_'+y+'_'+name.replace(/\s+/g,'_')+'.pdf',id='lohn_'+d.monat+'_'+ma.id,path='vertraulich/lohnabrechnungen/'+d.monat+'_'+ma.id+'_'+safe(name)+'.pdf';
    const u=await sb.storage.from('lp-dokumente').upload(path,blob,{contentType:'application/pdf',upsert:true});if(u.error)throw u.error;
    const r=await sb.from('lp_documents').upsert({library_file_id:id,file_name:fn,category:'Lohnabrechnungen',state:'in_supabase',storage_path:path,doc_date:d.monat+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0'),modified_on:today(),size_bytes:blob.size,notes:'Aus Stempeluhr erzeugt am '+fd(today())+': '+f(l.h)+' h, Brutto CHF '+f(l.brutto)+', Netto CHF '+f(l.netto)},{onConflict:'library_file_id'});if(r.error)throw r.error;
    if(!quiet){toast('Lohnabrechnung '+name+' im Archiv abgelegt');await load();stShow()}return true;
  }catch(e){fail(e);return false}
}
async function lohnAlle(){const d=S.st,ids=d.mitarbeiter.filter(m=>calcLohn(m,d.stamps).h>0).map(m=>m.id);if(!confirm(ids.length+' Lohnabrechnungen für '+d.monat+' erstellen und im Archiv ablegen? Bestehende werden ersetzt.'))return;let n=0;for(const id of ids)if(await lohnPdf(id,true))n++;toast(n+' Lohnabrechnungen im Archiv');await load();stShow()}
function vLog(){
  const lab={insert:'Neu',update:'Geändert',delete:'Gelöscht'},tn={lp_records:'Eintrag',lp_recurring:'Wiederkehrend',lp_documents:'Dokument',lp_bank_tx:'Bankbuchung',lp_bank_balance:'Kontostand',lp_members:'Benutzer'};
  M(`<h1>Änderungsprotokoll</h1><p class="mut">Jede Änderung wird automatisch mit Zeitpunkt und altem/neuem Wert gespeichert. Angezeigt werden die letzten 150.</p><div class="card"><div class="tw"><table><tr><th>Zeit</th><th>Wer</th><th>Bereich</th><th>Aktion</th><th>Betroffen</th><th>Geänderte Felder</th></tr>
  ${S.changes.map(c=>{const a=c.after_value||{},b=c.before_value||{},ch=c.action==='update'?Object.keys(a).filter(k=>k!=='updated_at'&&k!=='updated_by'&&JSON.stringify(a[k])!==JSON.stringify(b[k])):[];
   return `<tr><td class="num sm">${new Date(c.changed_at).toLocaleString('de-CH')}</td><td>${esc(nameOf(c.actor_id))}</td><td>${esc(tn[c.table_name]||c.table_name||'')}</td><td>${esc(lab[c.action]||c.action)}</td><td>${esc(a.title||b.title||a.file_name||b.file_name||a.description||b.description||a.display_name||b.display_name||'')}</td><td class="sm">${ch.map(k=>`${esc(k)}: ${esc(JSON.stringify(b[k])).slice(0,60)} → ${esc(JSON.stringify(a[k])).slice(0,60)}`).join('<br>')}</td></tr>`}).join('')||'<tr><td colspan="6" class="mut">Noch keine Änderungen.</td></tr>'}</table></div></div>${admin()?usersBox():''}`);
}
const RL={admin:'Administrator',editor:'Bearbeiter',viewer:'Nur lesen',pending:'Angefragt – nicht freigeschaltet'};
function usersBox(){return `<div class="card" style="margin-top:14px"><h2>Benutzer</h2><div class="tw"><table><tr><th>Name</th><th>E-Mail</th><th>Rolle</th><th></th></tr>${S.members.map(m=>`<tr><td>${esc(m.display_name||'–')}</td><td>${esc(m.email||(m.user_id===S.user.id?S.user.email:'–'))}</td><td>${m.role==='pending'?'<span class="b zu_pruefen">'+RL.pending+'</span>':esc(RL[m.role])}</td><td>${m.role==='pending'?`<button class="btn xs" onclick="userApprove('${m.user_id}')">Als Administrator freischalten</button>`:`<button class="btn xs sec" onclick="userName('${m.user_id}')">Name ändern</button>`}</td></tr>`).join('')}</table></div><p class="sm mut">Der Name bestimmt «Meine Aufgaben»: Er muss so lauten wie im Feld «Verantwortlich» (z. B. Arben, Levent). Rechte entziehen oder Konten sperren ist hier bewusst nicht möglich; das läuft über Claude.</p></div>`}
async function userApprove(id){const m=S.members.find(x=>x.user_id===id);if(!confirm('«'+(m.display_name||'')+'» ('+(m.email||'')+') als Administrator freischalten?\n\nDie Person erhält vollen Zugriff auf Finanzen, Personal, Dokumente und E-Mail.'))return;if(prompt('Zur Bestätigung bitte FREISCHALTEN eintippen:')!=='FREISCHALTEN')return toast('Abgebrochen');const {error}=await sb.from('lp_members').update({role:'admin'}).eq('user_id',id);error?fail(error):(toast('Freigeschaltet'),refresh())}
async function userName(id){const m=S.members.find(x=>x.user_id===id),n=prompt('Anzeigename:',m.display_name||'');if(!n||!n.trim())return;const {error}=await sb.from('lp_members').update({display_name:n.trim()}).eq('user_id',id);error?fail(error):refresh()}
boot();
</script>
