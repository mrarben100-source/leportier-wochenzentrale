<script>
const sb = supabase.createClient('https://pvrvhkyvnlafipbmidon.supabase.co','sb_publishable_dE2ZMkj9nEFy7lJ4miiTVw_5wvggHC_');
const $=s=>document.querySelector(s), root=$('#root'), dlg=$('#dlg');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chf=n=>n==null||n===''?'–':'CHF '+Number(n).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return x.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const fd=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'–';
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>{const d=new Date(s+'T12:00');return addDays(s,-((d.getDay()+6)%7))};
const ST={offen:'Offen',in_bearbeitung:'In Bearbeitung',wartet:'Wartet',erledigt:'Erledigt',zu_pruefen:'Zu prüfen'};
const PR={hoch:'1',mittel:'2',niedrig:'3'};
const CAT={aufgabe:'Aufgabe',zahlung:'Zahlung',event:'Event',lieferant:'Lieferant',dokument:'Dokument',personal:'Personal',vertrag:'Vertrag'};
const PEOPLE=['Arben','Dennis','Levent'];
const DOCCAT={'Lieferantenrechnungen':'lieferantenrechnungen','Bankauszüge':'vertraulich/bankauszuege','Zahlungsbestätigungen':'zahlungsbestaetigungen','Eventabrechnungen':'eventabrechnungen','Arbeitsverträge':'vertraulich/arbeitsvertraege','Lohnabrechnungen':'vertraulich/lohnabrechnungen','Versicherungen':'versicherungen','Mietvertrag':'mietvertrag','Betreibungen':'vertraulich/betreibungen','Buchhaltung':'vertraulich/buchhaltung','Sponsoringverträge':'sponsoringvertraege','Umsatzberichte':'umsatzberichte','personal':'vertraulich/personal','finanzen':'vertraulich/finanzen','buchhaltung':'vertraulich/buchhaltung','event':'eventabrechnungen','lieferant/vertrag':'lieferant-vertrag'};
const KIND={normal:'Normal',lieferantenbestellung:'Lieferantenbestellung',schuldenrueckzahlung:'Schuldenrückzahlung',lohn:'Lohn',event:'Event',sonstiges:'Sonstiges'};
const RV={ok:'OK',zu_pruefen:'Zu prüfen',duplikat:'Duplikat'};
const EVF=[['veranstalter','Veranstalter'],['verantwortlich','Verantwortliche'],['dj','DJ'],['security','Security'],['bar','Bar'],['garderobe','Garderobe'],['personalstunden','Personalstunden','n'],['ein_ticket','Ticketeinnahmen CHF','n'],['ein_karte','Karteneinnahmen CHF','n'],['ein_twint','TWINT-Einnahmen CHF','n'],['ein_bar','Bareinnahmen CHF','n'],['kosten_getraenke','Getränkekosten CHF','n'],['kosten_weitere','Weitere Ausgaben CHF','n'],['kosten_personal','Personalkosten CHF (Stempeluhr)','n'],['fehlende_belege','Fehlende Belege'],['freigabe','Zahlungsfreigabe']];
const DC='library_file_id,file_name,category,state,modified_on,size_bytes,notes,created_at,storage_path,record_id,doc_date,content_at';
let S={user:null,role:null,records:[],recurring:[],docs:[],tx:[],bal:[],changes:[],f:{}};
const admin=()=>S.role==='admin', canEdit=()=>S.role==='admin'||S.role==='editor';
function toast(m,err){const t=$('#toast');t.textContent=m;t.style.background=err?'#b3261e':'#222';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',err?6000:2600)}
const fail=e=>{console.error(e);toast('Fehler: '+(e.message||e),1)};
const sbadge=s=>`<span class="b ${esc(s)}">${esc(ST[s]||s)}</span>`;
const pbadge=p=>`<span class="b p${PR[p]||2}" title="Priorität">P${PR[p]||'?'}</span>`;
const opts=(o,sel,all)=>(all?`<option value="">${all}</option>`:'')+Object.entries(o).map(([k,v])=>`<option value="${esc(k)}"${k===sel?' selected':''}>${esc(v)}</option>`).join('');

/* ---------- Anmeldung ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return loginView();
  S.user=session.user;
  const {data:m}=await sb.from('lp_members').select('role,display_name').eq('user_id',S.user.id).maybeSingle();
  if(!m||m.role==='pending')return pendingView(m);
  S.role=m.role;S.name=m.display_name||S.user.email;
  await load();shell();route();live();autoMail();setInterval(autoMail,120000);calLoad(true);setInterval(()=>calLoad(true),900000);
}
function pendingView(m){
  root.innerHTML=`<div class="login"><div class="card"><h1>Zugang noch nicht freigeschaltet</h1><p>Angemeldet als <b>${esc(S.user.email)}</b>.</p>
  ${m?`<div class="note">Deine Anfrage ist gesendet. Ein Administrator muss dich im Dashboard unter «Protokoll → Benutzer» freischalten.</div><button class="btn" onclick="boot()">Erneut prüfen</button>`
     :`<p class="mut sm">Trag deinen Namen ein und sende die Anfrage. Danach schaltet dich ein Administrator frei.</p><input id="pn" placeholder="Vorname (z. B. Levent)"><button class="btn" id="pb">Zugang anfragen</button>`}
  <button class="btn sec" onclick="logout()">Abmelden</button></div></div>`;
  if(!m)$('#pb').onclick=async()=>{const n=$('#pn').value.trim();if(!n)return toast('Bitte Namen eintragen',1);const {error}=await sb.from('lp_members').insert({user_id:S.user.id,role:'pending',display_name:n});error?fail(error):boot()};
}
function live(){
  sb.channel('lp-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'lp_changes'},()=>S.dirty=true).on('postgres_changes',{event:'INSERT',schema:'public',table:'lp_comments'},()=>S.dirty=true).subscribe();
  setInterval(async()=>{if(!S.dirty||S.autoBusy||dlg.open||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;S.dirty=false;await load();route()},2500);
}
const nameOf=id=>id?(S.members.find(m=>m.user_id===id)?.display_name||(id===S.user.id?S.name:'Benutzer')):'System / ChatGPT';
const mine=r=>{const n=(S.name||'').split(/[\s@]/)[0];return n.length>1&&new RegExp('(^|[^\\p{L}])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^\\p{L}])','iu').test(r.responsible||'')};
function loginView(msg){
  root.innerHTML=`<div class="login"><div class="card"><h1>Le Portier N°35</h1><p class="mut">Wochenzentrale – Anmeldung</p>
  ${msg?`<div class="note">${esc(msg)}</div>`:''}
  <input id="le" type="email" placeholder="E-Mail" autocomplete="username"><input id="lp" type="password" placeholder="Passwort (mind. 8 Zeichen)" autocomplete="current-password">
  <button class="btn" id="li">Anmelden</button><button class="btn sec" id="lr">Neues Konto registrieren</button>
  <button class="btn sec" id="lf">Passwort vergessen</button></div></div>`;
  const cred=()=>({email:$('#le').value.trim(),password:$('#lp').value});
  $('#li').onclick=async()=>{const {error}=await sb.auth.signInWithPassword(cred());error?toast('Anmeldung fehlgeschlagen: '+error.message,1):boot()};
  $('#lp').onkeydown=e=>{if(e.key==='Enter')$('#li').click()};
  $('#lr').onclick=async()=>{const c=cred();if(c.password.length<8)return toast('Passwort mindestens 8 Zeichen',1);const {data,error}=await sb.auth.signUp({...c,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return fail(error);data.session?boot():loginView('Konto erstellt. Bitte den Link in der Bestätigungs-E-Mail anklicken und danach hier anmelden.')};
  $('#lf').onclick=async()=>{const e=$('#le').value.trim();if(!e)return toast('E-Mail eintragen',1);const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});error?fail(error):toast('E-Mail zum Zurücksetzen gesendet')};
}
async function logout(){await sb.auth.signOut();location.hash='';location.reload()}
sb.auth.onAuthStateChange(async ev=>{if(ev==='PASSWORD_RECOVERY'){const p=prompt('Neues Passwort (mind. 8 Zeichen):');if(p&&p.length>=8){const {error}=await sb.auth.updateUser({password:p});error?fail(error):toast('Passwort geändert')}}});

async function load(){
  const q=[sb.from('lp_records').select('*').order('due_date',{nullsFirst:false}),sb.from('lp_recurring').select('*').order('next_due'),sb.from('lp_documents').select(DC).order('file_name'),
    sb.from('lp_bank_tx').select('*').order('booking_date',{ascending:false}).limit(3000),sb.from('lp_bank_balance').select('*').order('as_of',{ascending:false}).limit(5),
    sb.from('lp_changes').select('*').order('changed_at',{ascending:false}).limit(150)];
  const r=await Promise.all(q);const e=r.find(x=>x.error);if(e)fail(e.error);
  [S.records,S.recurring,S.docs,S.tx,S.bal,S.changes]=r.map(x=>x.data||[]);
  const mm=await sb.from('lp_members').select('user_id,role,display_name,email,requested_at');S.members=mm.data||[];
}
async function refresh(){await load();route()}

/* ---------- Rahmen ---------- */
const NAV=[['uebersicht','Übersicht'],['aufgaben','Aufgaben'],['rechnungen','Rechnungen'],['finanzen','Finanzen'],['events','Events'],['lieferanten','Lieferanten'],['bestellungen','Bestellungen'],['personal','Personal'],['dokumente','Dokumente'],['kalender','Kalender'],['email','E-Mail'],['protokoll','Protokoll']];
function shell(){
  root.innerHTML=`<div id="app"><nav><div class="brand"><img src="icon-180.png" alt=""><div>Le Portier N°35<span>Wochenzentrale</span></div></div>${NAV.map(([k,l])=>`<a href="#${k}" data-k="${k}">${l}</a>`).join('')}
  <div class="who">${esc(S.name)} · ${esc({admin:'Admin',editor:'Bearbeiter',viewer:'Nur lesen'}[S.role])}<br><button onclick="logout()">Abmelden</button></div></nav><main id="main"></main></div>`;
}
window.onhashchange=()=>S.role&&route();
function route(){
  const k=(location.hash.slice(1)||'uebersicht');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));
  ({uebersicht:vHome,aufgaben:()=>vList('aufgaben'),rechnungen:vBills,finanzen:vFin,events:()=>vList('events'),lieferanten:()=>vList('lieferanten'),bestellungen:vOrders,personal:()=>vList('personal'),dokumente:vDocs,kalender:vCal,email:vMail,protokoll:vLog}[k]||vHome)();
}
const M=h=>$('#main').innerHTML=h;
const open=r=>r.status!=='erledigt';
const paidFor=id=>S.tx.filter(t=>t.record_id===id).reduce((a,t)=>a+Math.abs(+t.amount_chf),0);

/* ---------- Übersicht ---------- */
function vHome(){
  const t=today(),ws=monday(t),we=addDays(ws,6),R=S.records;
  const pay=R.filter(r=>r.category==='zahlung'),po=pay.filter(open),pd=pay.filter(r=>!open(r));
  const sum=a=>a.reduce((x,r)=>x+(+r.amount_chf||0),0);
  const crit=R.filter(r=>open(r)&&((r.due_date&&r.due_date<=addDays(t,7))||(/betreibung|mahnung/i.test(r.title+' '+r.notes)&&r.priority==='hoch')));
  const todayL=R.filter(r=>open(r)&&r.due_date&&r.due_date<=t), weekL=R.filter(r=>open(r)&&r.due_date&&r.due_date>t&&r.due_date<=we);
  const rec=S.recurring.filter(r=>r.active&&r.next_due<=we);
  const p1=R.filter(r=>open(r)&&r.priority==='hoch'&&!r.due_date);
  const b=S.bal[0],ev=R.filter(r=>r.category==='event'),miss=S.docs.filter(d=>!d.storage_path).length;
  const row=r=>`<tr class="click" onclick="editRec('${r.id}')"><td>${pbadge(r.priority)}</td><td>${esc(r.title)}<div class="mut sm">${esc(CAT[r.category])} · ${esc(r.responsible||'nicht zugewiesen')}</div></td><td class="num r">${r.amount_chf!=null?chf(r.amount_chf):''}<div class="sm ${r.due_date&&r.due_date<t?'':'mut'}" style="${r.due_date&&r.due_date<t?'color:var(--red)':''}">${r.due_date?fd(r.due_date):''}</div></td><td>${sbadge(r.status)}</td></tr>`;
  const tbl=(a,empty)=>a.length?`<div class="tw"><table>${a.map(row).join('')}</table></div>`:`<p class="mut sm">${empty}</p>`;
  M(`<h1>Übersicht</h1><p class="mut">Woche ${fd(ws)} – ${fd(we)}</p>
  <div class="grid">
   ${admin()?`<div class="card kpi"><div class="l">Kontostand Valiant</div><div class="v num">${b?chf(b.amount_chf):'–'}</div><div class="sm mut">${b?'Stand '+fd(b.as_of):'kein Stand erfasst'}</div></div>`:''}
   <div class="card kpi"><div class="l">Offene Zahlungen</div><div class="v num">${chf(sum(po))}</div><div class="sm mut">${po.length} Positionen, ${po.filter(r=>r.amount_chf==null).length} ohne Betrag</div></div>
   <div class="card kpi"><div class="l">Erledigte Zahlungen</div><div class="v num">${chf(sum(pd))}</div><div class="sm mut">${pd.length} Positionen</div></div>
   <div class="card kpi"><div class="l">Kritische Fristen</div><div class="v" style="color:${crit.length?'var(--red)':'inherit'}">${crit.length}</div><div class="sm mut">fällig innert 7 Tagen oder überfällig</div></div>
   <div class="card kpi"><div class="l">Zu prüfen</div><div class="v">${R.filter(r=>r.status==='zu_pruefen').length}</div><div class="sm mut">Einträge mit unbestätigten Angaben</div></div>
   <div class="card kpi"><div class="l">Dokumente</div><div class="v">${S.docs.length-miss} / ${S.docs.length}</div><div class="sm mut">${miss} Verweise ohne hochgeladene Datei</div></div>
  </div>
  <div class="note">Offene Zahlungen sind nur die erfassten Einzelbeträge. Sie sind kein bestätigter Gesamtschuldenstand; Salden mit Status «Zu prüfen» sind nicht bestätigt.</div>

function parseBfpos(txt){
  const rows=csvRows(txt.replace(/^\ufeff/,''),','),K={quelle:'bfpos',methoden:[],mwst:[],produkte:[]},f=v=>{const n=parseFloat(v);return isNaN(n)?0:n};let sec='';
  for(const r of rows){const a=(r[0]||'').trim();if(!a){sec='';continue}
    if(a==='Methode'||a==='Satz'||a==='Produkt'){sec=a;continue}
    if(sec==='Methode'){K.methoden.push({methode:a,anzahl:f(r[1]),netto:f(r[2]),trinkgeld:f(r[3]),total:f(r[4])});continue}
    if(sec==='Satz'){K.mwst.push({satz:a,modus:r[1],brutto:f(r[2]),mwst:f(r[3]),netto:f(r[4])});continue}
    if(sec==='Produkt'){K.produkte.push({name:a,menge:f(r[1]),umsatz:f(r[2])});continue}
    if(a==='Tagesabschluss')K.betrieb=r[1];else if(a==='Terminal')K.terminal=r[1];else if(/^Zeitraum/.test(a)){K.von=r[1];K.bis=r[2]}else if(/^Abschluss/.test(a))K.abschluss=parseInt(r[1],10);
    else if(/^BAR/.test(a))K.bar=f(r[1]);else if(/^UNBAR/.test(a))K.unbar=f(r[1]);else if(/^Sonstige/.test(a))K.sonstige=f(r[1]);else if(/^Umsatz/.test(a))K.netto=f(r[1]);else if(a==='Trinkgeld')K.trinkgeld=f(r[1]);else if(a==='Belege')K.belege=f(r[1]);else if(/^Total/.test(a))K.brutto=f(r[1])}
  if(K.von&&!isNaN(new Date(K.von)))K.datum=new Date(K.von).toLocaleDateString('sv-SE',{timeZone:'Europe/Zurich'});
  ['bar','unbar','sonstige','netto','trinkgeld','brutto'].forEach(k=>K[k]??=0);
  const c=(x,y)=>Math.abs(x-y)<0.006;
  K.ok=K.abschluss>0&&!!K.datum&&c(K.bar+K.unbar+K.sonstige,K.netto)&&c(K.netto+K.trinkgeld,K.brutto);
  return K;
}

   ${rs.map(r=>{const p=paidFor(r.id),docs=S.docs.filter(x=>x.record_id===r.id).length,done=billState(r)==='bezahlt',rest=r.amount_chf==null?null:done?0:Math.max(r.amount_chf-p,0);return `<tr class="click" onclick="editRec('${r.id}')"><td>${esc(r.title)}<div class="sm mut">${esc((r.notes||'').slice(0,140))}</div></td><td class="num" style="${!done&&r.due_date&&r.due_date<t?'color:var(--red)':''}">${fd(r.due_date)}</td><td class="num r">${chf(r.amount_chf)}</td><td class="num r">${p?chf(p):'–'}</td><td class="num r"><b>${chf(rest)}</b></td><td>${sbadge(r.status)}${r.confirmed_on&&done?'<div class="sm mut">'+fd(r.confirmed_on)+'</div>':''}</td><td class="sm">${docs?docs+' Beleg'+(docs>1?'e':''):'<span style="color:var(--red)">kein Beleg</span>'}</td><td>${!done&&admin()?`<button class="btn xs sec" onclick="event.stopPropagation();billPaid('${r.id}')">Als bezahlt markieren</button>`:''}</td></tr>`}).join('')}</table></div></div>`}).join('')||'<div class="card"><p class="mut">Keine Posten in dieser Ansicht.</p></div>'}

const SKIP=[/^Valiant Bank AG$/,/^Bundesplatz 4$/,/^3001 Bern$/,/^CHE-[\d.]+ MWST$/,/^(Datum\/Zeit|Vertrag|Konto|IBAN|Bezeichnung|Inhaber\/in)\s/,/^Kontoauszug$/,/^Datum\s+Buchungstext/,/Angaben ohne Gewähr/,/^Seite \d+/];
function parseValiant(lines){
  const R={rows:[],warn:[]},T=/^(\d\d\.\d\d\.\d{4})\s+(.*?)\s*(\d\d\.\d\d\.\d{4})\s+(-?[\d'’]+\.\d\d)\s+(-?[\d'’]+\.\d\d)$/,G=/^(\d\d\.\d\d\.\d{4})\s+(.*)\s+(\d\d\.\d\d\.\d{4})\s+(-?[\d'’]+\.\d\d)\s+(-?[\d'’]+\.\d\d)$/;
  let prev=null,cur=null;const tx=[];
  for(let l of lines){l=l.replace(/\s+/g,' ').trim();if(!l)continue;let m;
    if(m=l.match(/^Anfangssaldo per (\S+) CHF (-?[\d'’.]+)/)){if(R.start==null){R.start=pnum(m[2]);R.startDate=dmy(m[1]);prev=R.start}continue}
    if(m=l.match(/^Schlusssaldo per (\S+) CHF (-?[\d'’.]+)/)){R.end=pnum(m[2]);R.endDate=dmy(m[1]);continue}
    if(m=l.match(/^Belastungen CHF ([\d'’.]+)/)){R.deb=pnum(m[1]);continue}
    if(m=l.match(/^Gutschriften CHF ([\d'’.]+)/)){R.cre=pnum(m[1]);continue}
    if(SKIP.some(x=>x.test(l)))continue;
    if(m=l.match(G)||l.match(T)){const a=pnum(m[4]),s=pnum(m[5]);let sign=0;
      if(prev!=null){const d=Math.round((s-prev)*100)/100;if(Math.abs(Math.abs(d)-a)<0.006)sign=d<0?-1:1}
      if(!sign){sign=-1;R.warn.push('Vorzeichen unklar: '+m[1]+' '+m[2]+' '+m[4])}
      prev=s;cur={date:dmy(m[1]),val:dmy(m[3]),title:m[2].trim(),amt:a*sign,bal:s,det:[]};tx.push(cur);continue}
    if(cur)cur.det.push(l);
  }
  const LAB=/^(Begünstigter|Auftraggeber|Begünstigtenkonto|Betrag|Mitteilung \/ Referenz|Spesen)$/;
  const info=d=>{let p='',mi=[],b=null;for(let i=0;i<d.length;i++){if(/^(Begünstigter|Auftraggeber)$/.test(d[i])&&!p)p=d[i+1]||'';if(d[i]==='Betrag'&&b==null){const x=(d[i+1]||'').match(/^CHF (-?[\d'’.]+)$/);if(x)b=pnum(x[1])}if(d[i]==='Mitteilung / Referenz'){for(let j=i+1;j<d.length&&!LAB.test(d[j]);j++)mi.push(d[j])}}return{p,m:mi.join(' ').slice(0,90),b}};
  for(const t of tx){
    const title=t.title.replace(/ - \d\d\.\d\d\.\d{4}$/,''),blocks=[];let c=null;
    for(const x of t.det){if(/^(Begünstigter|Auftraggeber)$/.test(x)){c=[];blocks.push(c)}if(c)c.push(x)}
    const mk=(amt,det,bal,key,note)=>{const i=info(det),desc=[title,i.p,/^(Zahlung|Kartengeb)/.test(title)?'':i.m].filter(Boolean).join(' · '),r=RULES.find(x=>x[0].test(desc));
      return{booking_date:t.date,value_date:t.val,description:desc,amount_chf:amt,balance_chf:bal,category:r?r[1]:'unkategorisiert',kind:r?r[2]:'normal',review_state:'zu_pruefen',dedupe_key:key,notes:note||''}};
    const base='b|'+t.date+'|'+t.amt.toFixed(2)+'|'+t.bal.toFixed(2),parts=blocks.map(b=>info(b).b);
    if(blocks.length>1&&parts.every(x=>x!=null)&&Math.abs(parts.reduce((a,x)=>a+x,0)-Math.abs(t.amt))<0.006)
      blocks.forEach((b,i)=>R.rows.push(mk(parts[i]*Math.sign(t.amt),b,i===blocks.length-1?t.bal:null,base+'|p'+(i+1),'Teil '+(i+1)+'/'+blocks.length+' einer Sammelzahlung über CHF '+Math.abs(t.amt).toFixed(2))));
    else R.rows.push(mk(t.amt,t.det,t.bal,base));
  }
  const live=R.rows,sd=live.filter(r=>r.amount_chf<0).reduce((a,r)=>a-r.amount_chf,0),sc=live.filter(r=>r.amount_chf>0).reduce((a,r)=>a+r.amount_chf,0);
  R.sumDeb=Math.round(sd*100)/100;R.sumCre=Math.round(sc*100)/100;
  R.ok=R.deb!=null&&R.cre!=null&&Math.abs(R.sumDeb-R.deb)<0.006&&Math.abs(R.sumCre-R.cre)<0.006&&R.end!=null&&prev!=null&&Math.abs(prev-R.end)<0.006;
  return R;
}
async function pdfLines(pdf){
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){const tc=await(await pdf.getPage(p)).getTextContent(),rows=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const x=it.transform[4],y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<2.5);if(!r)rows.push(r={y,it:[]});r.it.push({x,w:it.width,s:it.str})}
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){r.it.sort((a,b)=>a.x-b.x);let s='',end=null;for(const i of r.it){s+=(end!=null&&i.x-end>1.2?' ':'')+i.s;end=i.x+i.w}out.push(s)}
  }
  return out;
}

async function importPdf(file){
  try{
    if(!window.pdfjsLib){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=ok;s.onerror=()=>no(new Error('PDF-Modul konnte nicht geladen werden'));document.head.appendChild(s)});

    toast('PDF wird gelesen…');
    const R=parseValiant(await pdfLines(await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise));
    if(!S.docs.some(d=>d.file_name===file.name&&+d.size_bytes===file.size&&d.storage_path)){const p=spath('Bankauszüge',file.name),u=await sb.storage.from('lp-dokumente').upload(p,file,{contentType:'application/pdf'});

    if(!R.rows.length)return toast('Im PDF wurden keine Buchungen erkannt. Die Datei liegt im Archiv; bitte an Claude senden.',1);
    R.rows.forEach(r=>r.source_file=file.name);
    const have=new Set(S.tx.map(t=>t.dedupe_key)),neu=R.rows.filter(r=>!have.has(r.dedupe_key)).length;
    dlg.innerHTML=`<form method="dialog" id="pf"><h2>Kontoauszug ${fd(R.startDate)} – ${fd(R.endDate)}</h2>
    <div class="note ${R.ok?'':'red'}">${R.ok?'Kontrolle bestanden: Die gelesenen Buchungen ergeben genau die Summen und den Schlusssaldo des Auszugs.':'<b>Kontrolle nicht bestanden.</b> Die gelesenen Summen weichen vom Auszug ab. Bitte nicht importieren und die Datei an Claude senden.'}</div>
    <table><tr><th></th><th class="r">Laut Auszug</th><th class="r">Gelesen</th></tr><tr><td>Belastungen</td><td class="num r">${chf(R.deb)}</td><td class="num r">${chf(R.sumDeb)}</td></tr><tr><td>Gutschriften</td><td class="num r">${chf(R.cre)}</td><td class="num r">${chf(R.sumCre)}</td></tr><tr><td>Schlusssaldo per ${fd(R.endDate)}</td><td class="num r">${chf(R.end)}</td><td></td></tr></table>
    <p class="sm">${R.rows.length} Buchungen (Sammelzahlungen sind in Einzelzahlungen aufgeteilt), davon <b>${neu} neu</b>. Alle werden als «Zu prüfen» eingetragen.</p>${R.warn.length?`<div class="note red sm">${R.warn.map(esc).join('<br>')}</div>`:''}
    <div class="tw" style="max-height:38vh;overflow:auto"><table>${R.rows.map(r=>`<tr><td class="num sm">${fd(r.booking_date)}</td><td class="sm">${esc(r.description)}<div class="mut">${esc(r.category)}</div></td><td class="num r sm" style="color:${r.amount_chf<0?'var(--red)':'var(--grn)'}">${chf(r.amount_chf)}</td></tr>`).join('')}</table></div>
    <div class="bar" style="justify-content:flex-end"><button class="btn sec" value="x">Abbrechen</button><button class="btn" value="s">${neu} Buchungen importieren</button></div></form>`;
    $('#pf').onsubmit=async e=>{if(e.submitter?.value!=='s')return;e.preventDefault();dlg.close();await saveTx(R.rows,R.end!=null?{as_of:R.endDate,amount_chf:R.end,source:'Valiant-Kontoauszug '+file.name}:null)};
    dlg.showModal();
  }catch(e){fail(e)}
}

const nname=n=>String(n||'').toLowerCase().normalize('NFC').replace(/\s*\(\d+\)(?=\.[^.]+$)/,'').replace(/[\s_]+/g,'_');
async function upload(){

const MIME={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',csv:'text/csv',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',xls:'application/vnd.ms-excel'};
async function unzipAll(files,res){
  const out=[];
  for(const f of files){
    if(!/\.zip$/i.test(f.name)){out.push(f);continue}
    if(!window.JSZip)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=ok;s.onerror=()=>no(new Error('ZIP-Modul konnte nicht geladen werden'));document.head.appendChild(s)});
    toast('Entpacke '+f.name+' …');const z=await JSZip.loadAsync(f);
    for(const e of Object.values(z.files)){if(e.dir)continue;const name=e.name.split('/').pop(),ext=(name.split('.').pop()||'').toLowerCase();
      if(/(^|\/)__MACOSX\//.test(e.name)||name.startsWith('.'))continue;
      if(!MIME[ext]){res.err.push(name+' (Format .'+ext+' wird nicht unterstützt)');continue}
      out.push(new File([await e.async('blob')],name,{type:MIME[ext]}))}
  }
  return out;
}
async function ensureXlsx(){if(window.XLSX)return;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('Excel-Modul konnte nicht geladen werden'));document.head.appendChild(s)})}
async function docText(d){
  const ext=(d.file_name.split('.').pop()||'').toLowerCase(),{data:blob,error}=await sb.storage.from('lp-dokumente').download(d.storage_path);if(error)throw error;
  let t='';
  if(ext==='csv'||ext==='txt'){const buf=await blob.arrayBuffer();t=new TextDecoder('utf-8').decode(buf);if(t.includes('�'))t=new TextDecoder('windows-1252').decode(buf)}
  else if(ext==='pdf'){await ensurePdf();const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;t=(await pdfLines(pdf)).join('\n')}
  else if(ext==='xlsx'||ext==='xls'){await ensureXlsx();const wb=XLSX.read(await blob.arrayBuffer(),{cellDates:true});t=wb.SheetNames.map(n=>'### Blatt: '+n+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n],{FS:';',blankrows:false})).join('\n\n')}
  t=t.replace(/\u0000/g,'');const max=600000;
  return t.length>max?t.slice(0,max)+'\n[… gekürzt, Original hat '+t.length+' Zeichen]':t;
}
async function textPending(quiet){
  if(!canEdit()||S.textBusy)return;S.textBusy=true;
  try{const seen=new Set(),todo=S.docs.filter(d=>d.storage_path&&!d.content_at&&!seen.has(d.storage_path)&&seen.add(d.storage_path));let ok=0,leer=0,err=0,i=0;
    for(const d of todo){if(!quiet)toast('Lese Inhalt '+(++i)+' / '+todo.length+': '+d.file_name);
      try{const t=await docText(d),{error}=await sb.from('lp_documents').update({content_text:t,content_at:new Date().toISOString()}).eq('storage_path',d.storage_path);if(error)throw error;t.trim()?ok++:leer++}catch(e){console.warn(d.file_name,e);err++}}
    if(todo.length){await load();if(!quiet){toast(ok+' Dateien gelesen, '+leer+' ohne lesbaren Text, '+err+' Fehler');route()}}else if(!quiet)toast('Alle Inhalte sind bereits bereitgestellt');
  }finally{S.textBusy=false}
}
async function docDedupe(){
  const g={},used={};S.docs.filter(d=>d.storage_path).forEach(d=>{(g[d.file_name+'|'+d.size_bytes]??=[]).push(d);used[d.storage_path]=(used[d.storage_path]||0)+1});
  const del=Object.values(g).filter(a=>a.length>1).flatMap(a=>a.sort((x,y)=>(x.created_at||'').localeCompare(y.created_at||'')).slice(1));
  if(!del.length)return toast('Keine Dubletten gefunden');
  if(!confirm(del.length+' Dublette(n) gefunden (exakt gleicher Name und gleiche Grösse). Die jeweils älteste Kopie bleibt erhalten.\n\nEntfernt werden:\n'+del.map(d=>'• '+d.file_name).join('\n')))return;
  let n=0;for(const d of del){if(--used[d.storage_path]<1){const s=await sb.storage.from('lp-dokumente').remove([d.storage_path]);if(s.error){fail(s.error);continue}}const {error}=await sb.from('lp_documents').delete().eq('library_file_id',d.library_file_id);error?fail(error):n++}
  toast(n+' Dublette(n) entfernt');refresh();
}

    yy+=5;T(ma.strasse||'',L);B(1);T('Geburtsdatum',130);B(0);T(ma.geburtsdatum||'–',R,{align:'right'});
    yy+=5;T(((ma.plz||'')+' '+(ma.ort||'')).trim(),L);
    yy+=12;B(1);T('Bezeichnung',L);T('Satz',118,{align:'right'});T('Pro Stunde',155,{align:'right'});T('Pro Monat',R,{align:'right'});line();B(0);
    const row=(a,b,c,e,bold)=>{yy+=7;B(bold);T(a,L);B(0);if(b)T(b,118,{align:'right'});if(c)T(c,155,{align:'right'});B(bold);T(e,R,{align:'right'});B(0)};
    row('Arbeitslohn','CHF '+f(l.satz)+'/h','CHF '+f(l.satz),'CHF '+f(l.arb));
    row('Ferienentschädigung '+f(LOHN.ferien)+'%',f(LOHN.ferien)+'%','CHF '+f(l.satz*LOHN.ferien/100),'CHF '+f(l.fer));
    row('Feiertagsentschädigung '+f(LOHN.feiertag)+'%',f(LOHN.feiertag)+'%','CHF '+f(l.satz*LOHN.feiertag/100),'CHF '+f(l.fei));
    row('13. Monatslohn '+f(LOHN.dm)+'% (auf Arb.+Ferien+Feiertag)',f(LOHN.dm)+'%','','CHF '+f(l.dm));line();
    row('Bruttolohn ('+f(l.h)+' h)','','','CHF '+f(l.brutto),1);
    yy+=10;B(1);T('Abzüge Arbeitnehmer',L);line();B(0);
    row('AHV/IV/EO '+f(LOHN.ahv)+'%',f(LOHN.ahv)+'%','','-CHF '+f(l.ahv));row('ALV '+f(LOHN.alv)+'%',f(LOHN.alv)+'%','','-CHF '+f(l.alv));row('KTG '+f(LOHN.ktg)+'%',f(LOHN.ktg)+'%','','-CHF '+f(l.ktg));
    if(l.isB)row('Quellensteuer Tarif A0N ('+f(l.qs)+'%)',f(l.qs)+'%','','-CHF '+f(l.qst));line();
    row('Total Abzüge','','','-CHF '+f(l.abz),1);
    yy+=10;doc.setFontSize(12);B(1);T('Nettolohn',L);T('CHF '+f(l.netto),R,{align:'right'});doc.setFontSize(9);
    yy+=14;B(1);T('Stunden-Übersicht',L);line();B(0);yy+=7;T('Gearbeitete Netto-Stunden',L);T(f(l.h)+' h',R,{align:'right'});
    yy=285;doc.setFontSize(8);doc.setTextColor(110);T('Zahltag '+new Date(y,mo,1).toLocaleDateString('de-CH')+' | Le Portier 35 / PrimeVibes GmbH, Aarbergergasse 35, 3011 Bern',105,{align:'center'});
    const blob=doc.output('blob'),fn='Lohnabrechnung_'+MON[mo-1]+'_'+y+'_'+name.replace(/\s+/g,'_')+'.pdf',id='lohn_'+d.monat+'_'+ma.id,path='vertraulich/lohnabrechnungen/'+d.monat+'_'+ma.id+'_'+safe(name)+'.pdf';
    const u=await sb.storage.from('lp-dokumente').upload(path,blob,{contentType:'application/pdf',upsert:true});if(u.error)throw u.error;
    const r=await sb.from('lp_documents').upsert({library_file_id:id,file_name:fn,category:'Lohnabrechnungen',state:'in_supabase',storage_path:path,doc_date:d.monat+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0'),modified_on:today(),size_bytes:blob.size,notes:'Aus Stempeluhr erzeugt am '+fd(today())+': '+f(l.h)+' h, Brutto CHF '+f(l.brutto)+', Netto CHF '+f(l.netto)},{onConflict:'library_file_id'});if(r.error)throw r.error;
    if(!quiet){toast('Lohnabrechnung '+name+' im Archiv abgelegt');await load();stShow()}return true;
  }catch(e){fail(e);return false}
}
async function lohnAlle(){const d=S.st,ids=d.mitarbeiter.filter(m=>calcLohn(m,d.stamps).h>0).map(m=>m.id);if(!confirm(ids.length+' Lohnabrechnungen für '+d.monat+' erstellen und im Archiv ablegen? Bestehende werden ersetzt.'))return;let n=0;for(const id of ids)if(await lohnPdf(id,true))n++;toast(n+' Lohnabrechnungen im Archiv');await load();stShow()}
function vLog(){
  const lab={insert:'Neu',update:'Geändert',delete:'Gelöscht'},tn={lp_records:'Eintrag',lp_recurring:'Wiederkehrend',lp_documents:'Dokument',lp_bank_tx:'Bankbuchung',lp_bank_balance:'Kontostand',lp_members:'Benutzer'};
  M(`<h1>Änderungsprotokoll</h1><p class="mut">Jede Änderung wird automatisch mit Zeitpunkt und altem/neuem Wert gespeichert. Angezeigt werden die letzten 150.</p><div class="card"><div class="tw"><table><tr><th>Zeit</th><th>Wer</th><th>Bereich</th><th>Aktion</th><th>Betroffen</th><th>Geänderte Felder</th></tr>
  ${S.changes.map(c=>{const a=c.after_value||{},b=c.before_value||{},ch=c.action==='update'?Object.keys(a).filter(k=>k!=='updated_at'&&k!=='updated_by'&&JSON.stringify(a[k])!==JSON.stringify(b[k])):[];
   return `<tr><td class="num sm">${new Date(c.changed_at).toLocaleString('de-CH')}</td><td>${esc(nameOf(c.actor_id))}</td><td>${esc(tn[c.table_name]||c.table_name||'')}</td><td>${esc(lab[c.action]||c.action)}</td><td>${esc(a.title||b.title||a.file_name||b.file_name||a.description||b.description||a.display_name||b.display_name||'')}</td><td class="sm">${ch.map(k=>`${esc(k)}: ${esc(JSON.stringify(b[k])).slice(0,60)} → ${esc(JSON.stringify(a[k])).slice(0,60)}`).join('<br>')}</td></tr>`}).join('')||'<tr><td colspan="6" class="mut">Noch keine Änderungen.</td></tr>'}</table></div></div>${admin()?usersBox():''}`);
}
const RL={admin:'Administrator',editor:'Bearbeiter',viewer:'Nur lesen',pending:'Angefragt – nicht freigeschaltet'};
function usersBox(){return `<div class="card" style="margin-top:14px"><h2>Benutzer</h2><div class="tw"><table><tr><th>Name</th><th>E-Mail</th><th>Rolle</th><th></th></tr>${S.members.map(m=>`<tr><td>${esc(m.display_name||'–')}</td><td>${esc(m.email||(m.user_id===S.user.id?S.user.email:'–'))}</td><td>${m.role==='pending'?'<span class="b zu_pruefen">'+RL.pending+'</span>':esc(RL[m.role])}</td><td>${m.role==='pending'?`<button class="btn xs" onclick="userApprove('${m.user_id}')">Als Administrator freischalten</button>`:`<button class="btn xs sec" onclick="userName('${m.user_id}')">Name ändern</button>`}</td></tr>`).join('')}</table></div><p class="sm mut">Der Name bestimmt «Meine Aufgaben»: Er muss so lauten wie im Feld «Verantwortlich» (z. B. Arben, Levent). Rechte entziehen oder Konten sperren ist hier bewusst nicht möglich; das läuft über Claude.</p></div>`}
async function userApprove(id){const m=S.members.find(x=>x.user_id===id);if(!confirm('«'+(m.display_name||'')+'» ('+(m.email||'')+') als Administrator freischalten?\n\nDie Person erhält vollen Zugriff auf Finanzen, Personal, Dokumente und E-Mail.'))return;if(prompt('Zur Bestätigung bitte FREISCHALTEN eintippen:')!=='FREISCHALTEN')return toast('Abgebrochen');const {error}=await sb.from('lp_members').update({role:'admin'}).eq('user_id',id);error?fail(error):(toast('Freigeschaltet'),refresh())}
async function userName(id){const m=S.members.find(x=>x.user_id===id),n=prompt('Anzeigename:',m.display_name||'');if(!n||!n.trim())return;const {error}=await sb.from('lp_members').update({display_name:n.trim()}).eq('user_id',id);error?fail(error):refresh()}
boot();
</script>
